<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과학실 교구 검색</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F8F6FF;--grid:#ECE8FB;--ink:#3A3150;--muted:#857C9E;--line:#E4DDF7;--card:#FFFFFF;
    --violet:#7B5CFA;--violet-soft:#EFEAFF;--berry:#FF5C9E;--berry-soft:#FFE6F1;

    --accent:var(--violet);--accent-soft:var(--violet-soft);

  *{box-sizing:border-box}
  html,body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
    background-color:var(--paper)}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--violet);outline-offset:2px}
  .wrap{max-width:880px;margin:0 auto;padding:4px 16px 16px}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:26px 16px 6px;max-width:880px;margin:0 auto}

  header.top .who{font-size:13px;color:var(--muted);text-align:right}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 16px 0;max-width:880px;margin:0 auto;scrollbar-width:none}
  .tab{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 14px;white-space:nowrap;cursor:pointer;font-family:var(--head);font-weight:600;font-size:15px;color:var(--muted)}
  .tab.on{background:var(--violet);border-color:var(--violet);color:#fff}
  .search{position:relative;margin:10px 0 10px}
  .search input{width:100%;padding:14px 46px 14px 48px;border:2px solid #CFC5EE;border-radius:14px;background:var(--card);font-size:17px;outline:none}
  .search input:focus{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
  .search::before{content:"";position:absolute;left:18px;top:50%;width:14px;height:14px;margin-top:-9px;border:2.5px solid var(--muted);border-radius:50%}
  .search::after{content:"";position:absolute;left:31px;top:50%;width:7px;height:2.5px;margin-top:5px;background:var(--muted);transform:rotate(45deg);border-radius:2px}
  .search .x{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer;padding:6px 10px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 13px;font-size:14px;cursor:pointer;font-family:var(--head);font-weight:500}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

  .chip[data-c="지구"]{background:var(--lav)} .chip[data-c="공통"]{background:var(--peach)} .chip[data-c="학용품"]{background:var(--rose)} .chip[data-c="안전"]{background:#FFD9D9} .chip[data-c="기타"]{background:#E6E3EE}
  .chip[data-c].on{background:var(--ink);color:#fff}
  .hint{color:var(--muted);font-size:14px;margin:4px 2px 12px}
  .list{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 15px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--sticker)}
  .card:hover{border-color:#CFC3F5}
  .card .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .card .n{font-family:var(--head);font-weight:600;font-size:16.5px} .card .q{color:var(--muted);font-size:14px;white-space:nowrap}
  .card .p{color:var(--muted);font-size:14px;margin-top:2px}
  .card .p b{color:var(--ink);font-weight:700}
  .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .b{font-size:12.5px;border-radius:8px;padding:2px 8px;background:var(--violet-soft);color:#4A3F6B}
  .b.bad{background:var(--bad-soft);color:var(--bad)} .b.warn{background:var(--warn-soft);color:var(--warn)}
  .b.ok{background:var(--ok-soft);color:var(--ok)} .b.ac{background:var(--berry-soft);color:var(--berry)}
  mark{background:var(--berry-soft);color:var(--bad);padding:0 2px;border-radius:4px}
  .empty{color:var(--muted);text-align:center;padding:40px 10px}
  .group h3{font-size:15px;margin:18px 2px 8px;color:var(--muted);font-weight:600}
  .cabbox{background:var(--card);border:2px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
  .cabbox summary{padding:12px 14px;cursor:pointer;font-family:var(--head);list-style:none;display:flex;justify-content:space-between}
  .cabbox summary::-webkit-details-marker{display:none}

  .cabbox .kan .kn{font-size:13px;color:var(--muted);margin:6px 0 2px}
  .cabbox .kan button{border:0;background:none;padding:3px 0;cursor:pointer;display:block;text-align:left;color:var(--ink)}
  .modal-bg{position:fixed;inset:0;background:rgba(58,49,80,.42);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  @media(min-width:700px){.modal-bg{align-items:center}}
  .modal{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 18px 24px}

  @media(min-width:700px){.modal{border-radius:20px;box-shadow:0 12px 40px rgba(58,49,80,.18)} .modal::before{display:none}}
  .modal h2{margin:0 0 4px;font-family:var(--head);font-weight:700;font-size:24px}
  .modal .close{float:right;border:0;background:#F1EEF8;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
  .path{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
  .path div{border-radius:12px;padding:10px 6px;text-align:center;border:1.5px solid rgba(58,49,80,.18)}
  .path div:nth-child(1){background:var(--lav)} .path div:nth-child(2){background:var(--peach)} .path div:nth-child(3){background:var(--mint)}
  .path small{display:block;color:var(--ink);opacity:.7;font-size:12px} .path strong{font-family:var(--head);font-weight:700;font-size:17px}
  .plan{width:100%;border-radius:14px;border:2px solid var(--line);margin-top:8px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:14.5px;margin:10px 0}
  .kv dt{color:var(--muted)} .kv dd{margin:0}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:12px}
  .form label{display:block;font-size:13px;color:var(--muted)}
  .form label > input,.form label > select,.form label > textarea,.form label > span:not(.req){display:block;width:100%;margin-top:4px}
  .form label > span[style*=flex]{display:flex !important}
  .form label.full{grid-column:1/-1}
  .form input,.form select,.form textarea{border:2px solid var(--line);border-radius:12px;padding:9px 10px;background:#fff;font-size:15px;color:var(--ink)}
  .form .chk{display:flex;flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:15px}
  .form .chk > input{width:auto;margin:0}
  @media(max-width:520px){.form{grid-template-columns:1fr}}
  .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .btn{border:1.5px solid #CFC5EE;background:var(--card);border-radius:10px;padding:9px 16px;cursor:pointer;font-family:var(--head);font-weight:600;font-size:15px}
  .btn.pri{background:var(--violet);border-color:var(--violet);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0 10px;flex-wrap:wrap}
  .panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--sticker)}
  .panel h3{margin:0 0 8px;font-family:var(--head);font-weight:700;font-size:19px}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
  .stat{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;box-shadow:var(--sticker)}
  .stat .v{font-family:var(--head);font-weight:700;font-size:26px} .stat .l{font-size:13px;color:var(--muted)}
  table.mini{width:100%;border-collapse:collapse;font-size:14px}
  table.mini th,table.mini td{border-bottom:1px dashed var(--line);padding:7px 6px;text-align:left;vertical-align:top}
  table.mini th{color:var(--muted);font-weight:500;font-size:13px}
  .scroll{overflow-x:auto}
  .note{font-size:13px;color:var(--muted)}
  .alert{border-radius:14px;padding:10px 12px;font-size:14px;margin:10px 0}
  .alert.warn{background:var(--warn-soft);color:#7a3e05} .alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.ac{background:var(--violet-soft);color:#45338F}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:99;max-width:90vw;display:none}
  #toast.err{background:var(--bad)}
  .loading{text-align:center;color:var(--muted);padding:60px 0;font-family:var(--head)}
  .spin{width:28px;height:28px;border:3px solid var(--lav);border-top-color:var(--berry);border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .room{margin:22px 0 6px}
  .room h3{margin:0 2px 6px;font-family:var(--head);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
  .room h3::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--violet)}
  
  .planbox{overflow-x:auto;border:1.5px solid #CFC5EE;border-radius:14px;background:#fff;margin-top:8px;-webkit-overflow-scrolling:touch}
  .planbox svg{display:block;min-width:540px;width:100%;height:auto}
  .planbox.fit svg{min-width:0}
  .planbox.wide svg{min-width:860px}
  @media(min-width:900px){.planbox.wide svg{min-width:0}}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:8px 4px 0;font-size:13px;color:var(--muted)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(58,49,80,.45);vertical-align:-1px;margin-right:4px}
  .cabsvg{margin-top:8px;overflow-x:auto} .cabsvg svg{display:block;margin:0 auto;max-width:100%;height:auto}
  .sec{font-family:var(--head);font-weight:600;font-size:15px;color:var(--ink);margin:18px 0 4px}
  .swipe{font-family:var(--body);font-size:12.5px;color:var(--muted);display:none} @media(max-width:600px){.swipe{display:inline}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}} .hi{animation:pulse 1.1s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}} .bob{animation:bob 1.2s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){.hi,.bob{animation:none}}
  .plan-cab{cursor:pointer} .plan-cab:hover rect{stroke:#7B5CFA}
  .req{color:#E5484D;font-weight:700;margin-left:2px}
  .form label.miss input,.form label.miss select,.form label.miss textarea{border-color:#E5484D;background:#FFF5F5}
  .form .reqnote{grid-column:1/-1;font-size:13px;color:var(--muted);margin:-4px 0 2px}
  .auto{grid-column:1/-1;background:#F4F1FF;border-radius:12px;padding:10px 12px;font-size:13.5px;color:#45338F}
  .auto b{color:var(--ink)}
  .tbtn{display:inline-block;background:var(--violet);color:#fff !important;text-decoration:none;font-weight:700;font-size:15px;padding:9px 18px;border-radius:12px;box-shadow:0 2px 8px rgba(123,92,250,.3)}
  .choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .choice button{border:1.5px solid #CFC5EE;background:#fff;border-radius:14px;padding:16px 12px;text-align:left;cursor:pointer}
  .choice button:hover{border-color:var(--violet)}
  .choice b{display:block;font-size:16.5px;margin-bottom:4px} .choice span{font-size:13px;color:var(--muted)}
  @media(max-width:520px){.choice{grid-template-columns:1fr}}
  details.more{grid-column:1/-1;border:1px dashed #CFC5EE;border-radius:12px;padding:8px 12px}
  details.more summary{cursor:pointer;color:var(--violet);font-weight:600;font-size:14px}
  details.more .form{margin-top:8px}
  .pending{opacity:.62} tr.pending td{color:var(--muted)}
</style>

<body>
<header class="top" id="top"></header>
<nav class="tabs" id="tabs"></nav>
<main class="wrap" id="main"><div class="loading"><div class="spin"></div>불러오는 중…</div></main>
<div id="modal"></div>
<div id="toast"></div>
<footer style="text-align:center;color:#9aa5a0;font-size:12px;padding:28px 16px 36px">화면 버전 10.08-F · GitHub<span id="srvver"></span></footer>
<script src="config.js"></script>
<script>
  // 주소는 config.js 파일에 적어 주세요. (config.js가 없으면 아래 값을 씁니다)
  if (typeof window.GAS_API !== 'string') window.GAS_API = '';
  if (typeof window.TEACHER_URL !== 'string') window.TEACHER_URL = '';
  const BOOT = { mode: 'student', data: null, studentUrl: '' };
</script>
<script>
(function(){
'use strict';
const st = { mode: BOOT.mode, data: null, tab: 'items', q: '', cat: '전체', view: 'search', rq: '', rf: '전체', logRid: '' };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === '' || v == null) ? '' : (Math.round(Number(v) * 100) / 100).toLocaleString('ko-KR');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };

// ── 검색(초성 포함) ──
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '');
const cho = s => Array.from(String(s || '')).map(ch => { const c = ch.charCodeAt(0) - 0xAC00; return (c >= 0 && c < 11172) ? CHO[Math.floor(c / 588)] : ch; }).join('');
const isCho = q => /^[ㄱ-ㅎ]+$/.test(q);
function matches(q, ...fields) {
  q = norm(q); if (!q) return true;
  const text = norm(fields.join(' '));
  return isCho(q) ? cho(text).includes(q) : text.includes(q);
}
function hl(text, q) {
  text = String(text || ''); q = String(q || '').trim();
  if (!q || isCho(norm(q))) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}

// ── 서버 호출 ──
const HOSTED = typeof window.GAS_API === 'string';   // GitHub 등 외부에 올린 학생용 화면
function call(fn, ...args) {
  if (HOSTED) {
    const kind = fn === 'getVersion' ? 'ver' : fn === 'getPublicData' ? 'public' : null;
    if (!kind) return Promise.reject(new Error('이 화면에서는 볼 수만 있어요.'));
    return fetch(window.GAS_API + (window.GAS_API.indexOf('?') < 0 ? '?' : '&') + 'api=' + kind, { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error('서버 응답 오류 (' + r.status + ')'); return r.json(); })
      .then(j => { if (j && j.error) throw new Error(j.error); return kind === 'ver' ? j.ver : j; });
  }
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e && e.message ? e : new Error(String(e))))[fn](...args));
}
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', err ? 6000 : 2600); }
function closeModal() { $('#modal').innerHTML = ''; if (st.dirty) { st.dirty = false; rerender(); } }
// 입력 중인 칸의 포커스를 지키면서 다시 그리기
function rerender() {
  if (!st.data) return;
  if ($('#modal').innerHTML) { st.dirty = true; return; }
  const a = document.activeElement, id = a && a.id, pos = a && a.selectionStart;
  render();
  if (id) { const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} } }
}

// ── 동기화: 시트가 바뀌면(버전 변경) 새 내용을 받아 옴 ──
st.saving = 0;
function dataFn() { return st.mode === 'teacher' ? 'getTeacherData' : 'getPublicData'; }
function refresh() {
  return call(dataFn()).then(d => { if (st.saving > 0) { st.stale = true; return; } st.data = d; st.ver = d.ver; saveCache(d); rerender(); }).catch(() => {});
}
function poll() {
  if (document.hidden || st.saving > 0 || !st.data) return;
  call('getVersion').then(v => { if (String(v) !== String(st.ver)) refresh(); }).catch(() => {});
}
function loadCache() { if (!HOSTED) return null; try { return JSON.parse(localStorage.getItem('sci_pub') || 'null'); } catch (e) { return null; } }
function saveCache(d) { if (!HOSTED) return; try { localStorage.setItem('sci_pub', JSON.stringify(d)); } catch (e) {} }
let syncing = false;
function startSync() {
  if (syncing) return; syncing = true;
  // 화면을 보고 있을 때는 자주(교사 4초, 학생 8초), 3분 넘게 손대지 않으면 30초마다 확인
  let last = Date.now();
  ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { last = Date.now(); }, { passive: true }));
  const tick = () => {
    const idle = Date.now() - last > 180000;
    const ms = idle ? 30000 : (st.mode === 'teacher' ? 4000 : 8000);
    poll(); setTimeout(tick, ms);
  };
  setTimeout(tick, st.mode === 'teacher' ? 4000 : 8000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { last = Date.now(); poll(); } });
  window.addEventListener('focus', () => { last = Date.now(); poll(); });
}
// 저장 요청을 보내고, 화면은 이미 바뀐 상태로 둔다. 실패하면 되돌린다.
function save(fn, arg, onOk, onFail) {
  st.saving++;
  return call(fn, arg).then(res => {
    st.saving--;
    const others = String(res.prevVer) !== String(st.ver);
    st.ver = res.ver;
    onOk(res);
    if ((others || st.stale) && st.saving === 0) { st.stale = false; refresh(); }
  }).catch(err => { st.saving--; onFail(err); });
}
const KAN = id => (st.data.kans || []).find(k => k.id === id);
function placeOf(kanId) {
  const k = KAN(kanId); if (!k) return { kanName: '', cabName: '', spaceName: '', cab: '', space: '', cabDesc: '' };
  const p = k.label.split(' › '); const c = st.data.cabs.find(x => x.id === k.cab) || {};
  return { spaceName: p[0] || '', cabName: p[1] || '', kanName: p.slice(2).join(' › '), cab: k.cab, space: c.space || '', cabDesc: c.desc || '' };
}
const driveImg = l => { l = String(l || '').trim(); const m = l.match(/\/d\/([\w-]{20,})/) || l.match(/[?&]id=([\w-]{20,})/); return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1600' : l; };
const pend = x => x && x._pending ? ' <span class="b ac">저장 중</span>' : '';

// ───────────────────────── 평면도 ─────────────────────────
const U = 44, PAD = 0.35, FAMILY = [['지구과학', '지구'], ['운동과 에너지', '운동'], ['물질', '물질'], ['생명과학', '생명'], ['공통', '공통'], ['학용품', '학용품']];

// 방 하나를 (ox, oy) 위치에 그림. 반환: { g, bubble }
// ── 배치도: 원본 표(세로로 쌓인 방)를 시계 방향으로 90° 돌려 가로로 그림 → 왼쪽부터 과학실·프로젝트실·준비실 ──
const PLAN_FONT = 'IBM Plex Sans KR, sans-serif';
function fitLines(name, ww, hh) {
  name = String(name || '').replace('운동과 에너지', '운동·에너지');
  let lines = [name], fs = Math.min(22, (ww - 10) / Math.max(1, name.length) * 1.05, hh * 0.52);
  if (fs < 12) {   // 한 줄로 작으면 "이름 / 번호" 두 줄
    const m = name.match(/^(.*?)\s*(\d+)$/);
    lines = m ? [m[1], m[2]] : name.split(' ');
    fs = Math.min(20, (ww - 8) / Math.max(...lines.map(l => l.length)) * 1.05, (hh - 6) / (lines.length * 1.2));
  }
  return { lines: lines, fs: Math.max(10, Math.floor(fs)) };
}
function textBlock(cx, cy, lines, fs, color, weight) {
  const lh = fs * 1.2, y0 = cy - (lines.length - 1) * lh / 2;
  return '<text text-anchor="middle" font-family="' + PLAN_FONT + '" font-weight="' + (weight || 600) + '" font-size="' + fs + '" fill="' + color + '">' +
    lines.map((l, i) => '<tspan x="' + cx + '" y="' + (y0 + i * lh) + '" dominant-baseline="central">' + esc(l) + '</tspan>').join('') + '</text>';

function planAll(hiCab, clickable, hiKan) {
  const d = st.data, WALL = 0.22, HEAD = 40;   // HEAD: 위쪽 방 이름 줄(px)
  const sizeOf = s => s.size || [Math.max(...d.cabs.filter(c => c.space === s.id && c.box).map(c => c.box[0] + c.box[2])), Math.max(...d.cabs.filter(c => c.space === s.id && c.box).map(c => c.box[1] + c.box[3]))];
  const order = (d.roomOrder || ['PREP', 'PROJ', 'LAB']).map(id => d.spaces.find(s => s.id === id)).filter(s => s && d.cabs.some(c => c.space === s.id && c.box))
    .map(s => Object.assign({}, s, { size: sizeOf(s) }));
  if (!order.length) return '';

  let y = WALL + PAD; const top = {}, walls = [];

    '<defs><pattern id="gpAll" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#F2EFFB" stroke-width="1"/></pattern></defs>' +
    '<rect x="' + t + '" y="' + (HEAD + t) + '" width="' + (Wpx - 2 * t) + '" height="' + (Hpx - HEAD - 2 * t) + '" fill="url(#gpAll)"/>';
  // 방 이름(배치도 위쪽)
  order.forEach(s => { const [rx, , rw] = R(0, top[s.id], 1, s.size[1]); g += textBlock(rx + rw / 2, HEAD / 2 + 2, [s.name], 24, '#7B5CFA', 700); });

  g += '<rect x="' + (t / 2) + '" y="' + (HEAD + t / 2) + '" width="' + (Wpx - t) + '" height="' + (Hpx - HEAD - t) + '" rx="6" fill="none" stroke="#3A3150" stroke-width="' + t + '"/>';
  walls.forEach(wl => {
    const xx = (Ht - wl.y - WALL / 2) * U;
    const door = (d.doors || [['PREP', 'PROJ', 1.136, 1.136], ['PROJ', 'LAB', 1.136, 1.136]]).find(o => o[0] === wl.up && o[1] === wl.down);
    if (!door) { g += '<line x1="' + xx + '" x2="' + xx + '" y1="' + HEAD + '" y2="' + Hpx + '" stroke="#3A3150" stroke-width="' + t + '"/>'; return; }
    const g0 = (door[2] + ox) * U + HEAD, g1 = g0 + door[3] * U;
    g += '<line x1="' + xx + '" x2="' + xx + '" y1="' + HEAD + '" y2="' + g0 + '" stroke="#3A3150" stroke-width="' + t + '"/>' +
      '<line x1="' + xx + '" x2="' + xx + '" y1="' + g1 + '" y2="' + Hpx + '" stroke="#3A3150" stroke-width="' + t + '"/>';
  });
  // 사물함
  let bubble = '';
  order.forEach(s => d.cabs.filter(c => c.space === s.id && c.box).forEach(c => {
    const col = c.box[4] || famColor(c.name), hi = c.id === hiCab;
    const [X0, Y0, W0, H0] = R(c.box[0] + ox, c.box[1] + top[s.id], c.box[2], c.box[3]);
    const X = X0 + 2, Y = Y0 + 2, ww = W0 - 4, hh = H0 - 4;
    g += '<g class="' + (clickable ? 'plan-cab' : '') + '" data-pcab="' + esc(c.id) + '"' + (clickable ? ' role="button" tabindex="0" aria-label="' + esc(c.name) + '"' : '') + '>' +
      '<rect' + (hi ? ' class="hi"' : '') + ' x="' + X + '" y="' + Y + '" width="' + ww + '" height="' + hh + '" rx="8" fill="' + (hi ? '#FF5C9E' : col) + '" stroke="' + (hi ? '#C81E5B' : '#6E6488') + '" stroke-width="' + (hi ? 3 : 1.3) + '"/>';
    if (c.id.indexOf('ETC') >= 0) {
      // 원본: 위쪽 7~12 / 아래쪽 1~6  →  회전 후: 오른쪽 7~12 / 왼쪽 1~6 (위에서 아래로)
      // 양옆 사물함(1·3·5·8·10·12)은 배치도처럼 2칸 크기로 (왼쪽·오른쪽은 사물함 칸 그림에서 보여 줌)

        const units = col.reduce((a, x) => a + (x.dbl ? 2 : 1), 0) || 1, uh = (hh - 12) / units;

        '<path d="M' + (bx - 7) + ' ' + by + ' L' + bx + ' ' + (above ? by + 8 : by - 8) + ' L' + (bx + 7) + ' ' + by + 'Z" fill="#3A3150"/>' +
        textBlock(bx, above ? by - 15 : by + 15, ['여기!'], 16, '#fff', 700) + '</g>';
    }
  }));
  return '<svg viewBox="0 0 ' + Wpx + ' ' + Hpx + '" role="img" aria-label="과학실, 프로젝트실, 준비실 배치도">' + g + bubble + '</svg>';
}
function planSVG(spaceId, hiCab, clickable, hiKan) { return planAll(hiCab, clickable, hiKan); }
// 기타 사물함: 번호별로 묶기 → [{ n, dbl, kans:[칸], L, R }]  (칸ID 끝이 n, nL, nR)
const ETC_DOUBLE = [1, 3, 5, 8, 10, 12];
function etcLockers(cabId) {
  const by = {};
  (st.data.kans || []).filter(k => k.cab === cabId).forEach(k => {
    const m = /-(\d+)([LR]?)$/.exec(String(k.id)); if (!m) return;
    const n = Number(m[1]), o = by[n] = by[n] || { n: n, kans: [] };

}
// 기타 사물함 칸 그림: 위 7~12, 아래 1~6. 양옆 사물함은 왼쪽 | 오른쪽 두 칸

    '<rect x="6" y="' + (top - 4) + '" width="' + (W - 12) + '" height="' + (rows.length * ch + 8) + '" rx="10" fill="' + esc((cab.box && cab.box[4]) || '#EDEBF2') + '" stroke="#6E6488" stroke-width="1.5"/>';

function cabSVG(cabId, hiKan) {

  if (!kans.length) return '';

  if (LR) {

    Object.keys(rows).sort((a, b) => (a[0] === b[0] ? Number(a.slice(1)) - Number(b.slice(1)) : (a[0] === 'U' ? -1 : 1))).forEach(key => grid.push([rows[key].L, rows[key].R]));
  } else if (UD) {

    '<rect x="6" y="' + (top - 4) + '" width="' + (W - 12) + '" height="' + (grid.length * ch + 8) + '" rx="10" fill="' + esc((cab.box && cab.box[4]) || famColor(cab.name)) + '" stroke="#6E6488" stroke-width="1.5"/>';

// 서버의 parseSpec_와 같은 규칙: "500 mL", "1 L", "1 kg" → 한 병 양(관리단위)
function specPer(spec) {
  const m = String(spec || '').replace(/\s+/g, ' ').trim().match(/^([\d.,]+)\s*(mL|ml|ML|L|l|g|kg|KG)$/);
  if (!m) return null;
  let v = Number(m[1].replace(/,/g, '')), u = m[2];
  if (/^ml$/i.test(u)) u = 'mL'; else if (/^l$/i.test(u)) { v *= 1000; u = 'mL'; } else if (/^kg$/i.test(u)) { v *= 1000; u = 'g'; }
  return isNaN(v) ? null : { per: v, unit: u };
}

    ['유효기한 90일 이내', R.filter(r => r.expState === '90일 이내'), 'warn', '유효기한'],
    ['유해화학물질(O)', R.filter(r => r.haz === 'O'), 'bad', '유해화학물질'],

    ['MSDS 미게시', R.filter(r => !yes(r.msds) && !yes(r.noMsds)), 'warn', 'MSDS 미게시'],

    '<div class="stats">' + groups.map((g, i) => '<button class="stat" data-g="' + i + '"><div class="v" style="color:' + (g[1].length && g[2] === 'bad' ? 'var(--bad)' : g[1].length && g[2] === 'warn' ? 'var(--warn)' : 'inherit') + '">' + g[1].length + '</div><div class="l">' + g[0] + '</div></button>').join('') + '</div>' +
    '<div id="glist"></div>' +
    '<div class="panel"><h3>정기 점검 일정 (2026 과학실 안전관리 계획)</h3><ul class="note" style="margin:0;padding-left:18px">' +
      '<li>매월 4일: 과학실험실 안전관리 자체 점검표(서식1), 폐수·폐기물 자체 점검표(서식5)</li>' +
      '<li>출납대장(서식3) 5년, 폐수·폐시약 관리대장(서식4) 3년 보존</li>' +
      '<li>상·하반기 안전점검 운영 실적(서식2) 교육지원청 제출</li>' +
      (haz ? '<li>유해화학물질 취급시설 자체점검 주 1회 이상</li>' : '') +
    '</ul><p class="note"><a href="' + esc(d.sheetUrl) + '" target="_blank">구글 시트 열기</a> — 출납대장_출력, 폐수대장_출력, 시약장_목록표 시트에서 인쇄할 수 있어요.</p></div>';
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    const g = groups[Number(b.dataset.g)];
    $('#glist').innerHTML = '<div class="panel"><h3>' + g[0] + ' (' + g[1].length + ')</h3>' + (g[1].length ? '<div class="list">' + g[1].map(x => x.formula !== undefined
      ? '<button class="card" data-rg="' + esc(x.id) + '"><div class="t"><span class="n">' + esc(x.name) + '</span><span class="q">' + esc(x.exp || '') + '</span></div><div class="p">' + esc(x.loc) + '</div></button>'
      : '<button class="card" data-item="' + esc(x.id) + '"><div class="t"><span class="n">' + esc(x.name) + '</span></div><div class="p">' + esc(x.note) + '</div></button>').join('') + '</div>' : '<p class="note">해당 없음</p>') + '</div>';
    $('#glist').querySelectorAll('[data-rg]').forEach(c => c.onclick = () => rgDetail(c.dataset.rg));
    bindItemCards($('#glist'));
    $('#glist').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

start();
})();
</script>
</body>
</html>
