<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과학실 교구 검색</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F8F6FF;--grid:#ECE8FB;--ink:#3A3150;--muted:#857C9E;--line:#E4DDF7;--card:#FFFFFF;
    --violet:#7B5CFA;--violet-soft:#EFEAFF;--berry:#FF5C9E;--berry-soft:#FFE6F1;
    --lav:#E3DAFF;--sky:#D3E8FF;--mint:#C9F0E3;--butter:#FFF1B8;--peach:#FFE0CC;--rose:#FBD3E4;
    --accent:var(--violet);--accent-soft:var(--violet-soft);
    --warn:#B5530E;--warn-soft:#FFF0DC;--bad:#C81E5B;--bad-soft:#FFE3EE;--ok:#16835B;--ok-soft:#DDF6EC;
    --r:14px;--sticker:0 1px 2px rgba(58,49,80,.06);
    --head:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
    background-color:var(--paper)}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--violet);outline-offset:2px}
  .wrap{max-width:880px;margin:0 auto;padding:4px 16px 16px}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:26px 16px 6px;max-width:880px;margin:0 auto}
  header.top h1{margin:0;font-family:var(--head);font-weight:700;font-size:26px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  header.top h1 svg{flex:none}
  header.top .sub{color:var(--muted);font-size:14px;margin-top:2px}
  header.top .who{font-size:13px;color:var(--muted);text-align:right}
  header.top .who a{color:var(--violet)}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 16px 0;max-width:880px;margin:0 auto;scrollbar-width:none}
  .tab{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 14px;white-space:nowrap;cursor:pointer;font-family:var(--head);font-weight:600;font-size:15px;color:var(--muted)}
  .tab.on{background:var(--violet);border-color:var(--violet);color:#fff}
  .search{position:relative;margin:10px 0 10px}
  .search input{width:100%;padding:14px 46px 14px 48px;border:2px solid #CFC5EE;border-radius:14px;background:var(--card);font-size:17px;outline:none}
  .search input:focus{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
  .search::before{content:"";position:absolute;left:18px;top:50%;width:14px;height:14px;margin-top:-9px;border:2.5px solid var(--muted);border-radius:50%}
  .search::after{content:"";position:absolute;left:31px;top:50%;width:7px;height:2.5px;margin-top:5px;background:var(--muted);transform:rotate(45deg);border-radius:2px}
  .search .x{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer;padding:6px 10px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 13px;font-size:14px;cursor:pointer;font-family:var(--head);font-weight:500}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip[data-c="물리"]{background:var(--sky)} .chip[data-c="화학"]{background:var(--butter)} .chip[data-c="생명"]{background:var(--mint)}
  .chip[data-c="지구"]{background:var(--lav)} .chip[data-c="공통"]{background:var(--peach)} .chip[data-c="학용품"]{background:var(--rose)} .chip[data-c="안전"]{background:#FFD9D9} .chip[data-c="기타"]{background:#E6E3EE}
  .chip[data-c].on{background:var(--ink);color:#fff}
  .hint{color:var(--muted);font-size:14px;margin:4px 2px 12px}
  .list{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 15px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--sticker)}
  .card:hover{border-color:#CFC3F5}
  .card .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .card .n{font-family:var(--head);font-weight:600;font-size:16.5px} .card .q{color:var(--muted);font-size:14px;white-space:nowrap}
  .card .p{color:var(--muted);font-size:14px;margin-top:2px}
  .card .p b{color:var(--ink);font-weight:700}
  .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}

  .b.bad{background:var(--bad-soft);color:var(--bad)} .b.warn{background:var(--warn-soft);color:var(--warn)}
  .alert.ok{background:var(--ok-soft);color:var(--ok)}
  .b.ok{background:var(--ok-soft);color:var(--ok)} .b.ac{background:var(--berry-soft);color:var(--berry)}
  mark{background:var(--berry-soft);color:var(--bad);padding:0 2px;border-radius:4px}
  .empty{color:var(--muted);text-align:center;padding:40px 10px}
  .group h3{font-size:15px;margin:18px 2px 8px;color:var(--muted);font-weight:600}
  .cabbox{background:var(--card);border:2px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
  .cabbox summary{padding:12px 14px;cursor:pointer;font-family:var(--head);list-style:none;display:flex;justify-content:space-between}
  .cabbox summary::-webkit-details-marker{display:none}
  .cabbox .kan{padding:6px 14px 10px;border-top:1px solid var(--line)}
  .cabbox .kan .kn{font-size:13px;color:var(--muted);margin:6px 0 2px}
  .cabbox .kan button{border:0;background:none;padding:3px 0;cursor:pointer;display:block;text-align:left;color:var(--ink)}
  .modal-bg{position:fixed;inset:0;background:rgba(58,49,80,.42);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  @media(min-width:700px){.modal-bg{align-items:center}}

  @media(min-width:700px){.modal{border-radius:20px;box-shadow:0 12px 40px rgba(58,49,80,.18)} .modal::before{display:none}}

  .modal .close{float:right;border:0;background:#F1EEF8;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
  .path{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
  .path div{border-radius:12px;padding:10px 6px;text-align:center;border:1.5px solid rgba(58,49,80,.18)}
  .path div:nth-child(1){background:var(--lav)} .path div:nth-child(2){background:var(--peach)} .path div:nth-child(3){background:var(--mint)}
  .path small{display:block;color:var(--ink);opacity:.7;font-size:12px} .path strong{font-family:var(--head);font-weight:700;font-size:17px}
  .plan{width:100%;border-radius:14px;border:2px solid var(--line);margin-top:8px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:14.5px;margin:10px 0}
  .kv dt{color:var(--muted)} .kv dd{margin:0}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:12px}
  .form label{display:block;font-size:13px;color:var(--muted)}
  .form label > input,.form label > select,.form label > textarea,.form label > span:not(.req){display:block;width:100%;margin-top:4px}
  .form label > span[style*=flex]{display:flex !important}
  .form label.full{grid-column:1/-1}
  .form input,.form select,.form textarea{border:2px solid var(--line);border-radius:12px;padding:9px 10px;background:#fff;font-size:15px;color:var(--ink)}
  .form .chk{display:flex;flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:15px}

  .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .btn{border:1.5px solid #CFC5EE;background:var(--card);border-radius:10px;padding:9px 16px;cursor:pointer;font-family:var(--head);font-weight:600;font-size:15px}
  .btn.pri{background:var(--violet);border-color:var(--violet);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0 10px;flex-wrap:wrap}
  .panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--sticker)}
  .panel h3{margin:0 0 8px;font-family:var(--head);font-weight:700;font-size:19px}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
  .stat{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;box-shadow:var(--sticker)}
  .stat .v{font-family:var(--head);font-weight:700;font-size:26px} .stat .l{font-size:13px;color:var(--muted)}
  table.mini{width:100%;border-collapse:collapse;font-size:14px}
  table.mini th,table.mini td{border-bottom:1px dashed var(--line);padding:7px 6px;text-align:left;vertical-align:top}
  table.mini th{color:var(--muted);font-weight:500;font-size:13px}
  .scroll{overflow-x:auto}
  .note{font-size:13px;color:var(--muted)}
  .alert{border-radius:14px;padding:10px 12px;font-size:14px;margin:10px 0}
  .alert.warn{background:var(--warn-soft);color:#7a3e05} .alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.ac{background:var(--violet-soft);color:#45338F}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:99;max-width:90vw;display:none}
  #toast.err{background:var(--bad)}
  .loading{text-align:center;color:var(--muted);padding:60px 0;font-family:var(--head)}
  .spin{width:28px;height:28px;border:3px solid var(--lav);border-top-color:var(--berry);border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .room{margin:22px 0 6px}
  .room h3{margin:0 2px 6px;font-family:var(--head);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
  .room h3::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--violet)}
  
  .planbox{overflow-x:auto;border:1.5px solid #CFC5EE;border-radius:14px;background:#fff;margin-top:8px;-webkit-overflow-scrolling:touch}
  .planbox svg{display:block;min-width:540px;width:100%;height:auto}
  .planbox.fit svg{min-width:0}
  .planbox.wide svg{min-width:860px}
  @media(min-width:900px){.planbox.wide svg{min-width:0}}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:8px 4px 0;font-size:13px;color:var(--muted)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(58,49,80,.45);vertical-align:-1px;margin-right:4px}
  .cabsvg{margin-top:8px;overflow-x:auto} .cabsvg svg{display:block;margin:0 auto;max-width:100%;height:auto}
  .sec{font-family:var(--head);font-weight:600;font-size:15px;color:var(--ink);margin:18px 0 4px}
  .swipe{font-family:var(--body);font-size:12.5px;color:var(--muted);display:none} @media(max-width:600px){.swipe{display:inline}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}} .hi{animation:pulse 1.1s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}} .bob{animation:bob 1.2s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){.hi,.bob{animation:none}}
  .plan-cab{cursor:pointer} .plan-cab:hover rect{stroke:#7B5CFA}
  .req{color:#E5484D;font-weight:700;margin-left:2px}
  .form label.miss input,.form label.miss select,.form label.miss textarea{border-color:#E5484D;background:#FFF5F5}
  .form .reqnote{grid-column:1/-1;font-size:13px;color:var(--muted);margin:-4px 0 2px}
  .auto{grid-column:1/-1;background:#F4F1FF;border-radius:12px;padding:10px 12px;font-size:13.5px;color:#45338F}
  .auto b{color:var(--ink)}
  .thumb{width:56px;height:56px;object-fit:cover;border-radius:10px;flex:none;background:#EEEAF6}
  .photoprev{max-width:100%;max-height:220px;border-radius:12px;display:block;margin-top:6px}
  .btn.danger{color:var(--bad);border-color:#F2C4CC;background:#fff} .btn.danger:hover{background:var(--bad-soft)}
  .btn.dangerpri{background:var(--bad);color:#fff;border-color:var(--bad)} .btn:disabled{opacity:.45;cursor:not-allowed}
  button.tbtn{border:0;cursor:pointer;font-family:inherit}
  .tbtn{display:inline-block;background:var(--violet);color:#fff !important;text-decoration:none;font-weight:700;font-size:15px;padding:9px 18px;border-radius:12px;box-shadow:0 2px 8px rgba(123,92,250,.3)}
  .choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .choice button{border:1.5px solid #CFC5EE;background:#fff;border-radius:14px;padding:16px 12px;text-align:left;cursor:pointer}
  .choice button:hover{border-color:var(--violet)}
  .choice b{display:block;font-size:16.5px;margin-bottom:4px} .choice span{font-size:13px;color:var(--muted)}
  @media(max-width:520px){.choice{grid-template-columns:1fr}}
  details.more{grid-column:1/-1;border:1px dashed #CFC5EE;border-radius:12px;padding:8px 12px}
  details.more summary{cursor:pointer;color:var(--violet);font-weight:600;font-size:14px}
  details.more .form{margin-top:8px}
  .pending{opacity:.62} tr.pending td{color:var(--muted)}
  .b.req1,.b.req2{white-space:nowrap;display:inline-block}
  .erec{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;display:flex;gap:10px;align-items:flex-start}
  .erec .m{flex:1;min-width:0;font-size:14px} .erec .m b{font-family:var(--head)} .erec .s{color:var(--muted);font-size:13px;margin-top:2px}
  .erec .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12.5px;color:var(--muted)}
  .erec .r label{display:flex;gap:5px;align-items:center;white-space:nowrap}
  .b.req1{background:#FFE3EE;color:#C81E5B;font-weight:700} .b.req2{background:#E3EEFF;color:#2456A6;font-weight:600}
  table.mini input[type=checkbox]{width:18px;height:18px}
</style>

<body>
<header class="top" id="top"></header>
<nav class="tabs" id="tabs"></nav>
<main class="wrap" id="main"><div class="loading"><div class="spin"></div>불러오는 중…</div></main>
<div id="modal"></div>
<div id="toast"></div>
<footer style="text-align:center;color:#9aa5a0;font-size:12px;padding:28px 16px 36px">화면 버전 11.13-A · GitHub<span id="srvver"></span></footer>
<script src="config.js"></script>
<script>
  // 주소는 config.js 파일에 적어 주세요. (config.js가 없으면 아래 값을 씁니다)
  if (typeof window.GAS_API !== 'string') window.GAS_API = '';
  if (typeof window.TEACHER_URL !== 'string') window.TEACHER_URL = '';
  const BOOT = { mode: 'student', data: null, studentUrl: '' };
</script>
<script>
(function(){
'use strict';
const st = { mode: BOOT.mode === 'login' ? 'student' : BOOT.mode, data: null, tab: 'items', q: '', cat: '전체', view: 'search', rq: '', rf: '전체', logRid: '' };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === '' || v == null) ? '' : (Math.round(Number(v) * 100) / 100).toLocaleString('ko-KR');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };

// ── 검색(초성 포함) ──
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '');
const cho = s => Array.from(String(s || '')).map(ch => { const c = ch.charCodeAt(0) - 0xAC00; return (c >= 0 && c < 11172) ? CHO[Math.floor(c / 588)] : ch; }).join('');
const isCho = q => /^[ㄱ-ㅎ]+$/.test(q);
function matches(q, ...fields) {
  q = norm(q); if (!q) return true;
  const text = norm(fields.join(' '));
  return isCho(q) ? cho(text).includes(q) : text.includes(q);
}
const usageOf = r => (typeof r.usage === 'string' ? r.usage.trim() : '');   // 체크박스 값(TRUE/FALSE)이 섞여도 글만
function hl(text, q) {
  text = String(text || ''); q = String(q || '').trim();
  if (!q || isCho(norm(q))) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}

// ── 서버 호출 ──
const HOSTED = typeof window.GAS_API === 'string';   // GitHub 등 외부에 올린 학생용 화면
// ── 교사 비밀번호 로그인: 토큰을 이 기기에 보관(기억하기 → 7일, 아니면 창을 닫을 때까지) ──
const TOK_KEY = 'sci_tok';
const tokGet = () => { try { return localStorage.getItem(TOK_KEY) || sessionStorage.getItem(TOK_KEY) || ''; } catch (e) { return ''; } };
const tokSet = (t, remember) => { try { (remember ? localStorage : sessionStorage).setItem(TOK_KEY, t); } catch (e) {} };
const tokClear = () => { try { localStorage.removeItem(TOK_KEY); sessionStorage.removeItem(TOK_KEY); } catch (e) {} };
const TEACHER_FNS = ['getTeacherData', 'saveItem', 'saveReagent', 'addLog', 'addWaste', 'receiveReagent', 'analyzeMsds', 'uploadMsds', 'uploadPhoto', 'deleteItem', 'deleteReagent',
  'setupEduWeb', 'saveEdu', 'deleteEdu', 'markEduDone', 'bulkAcquire', 'linkStd', 'saveEquip', 'saveEduConf'];
function loginErr(m) {
  m = String(m || '');
  if (/LOGIN_NEEDED/.test(m)) { tokClear(); st.tok = ''; setTimeout(() => showLogin('로그인이 끝났어요. 다시 로그인해 주세요.'), 50); }
  return new Error(m.replace(/^.*LOGIN_NEEDED:\s*/, ''));
}
function call(fn, ...args) {
  const teacherFn = st.tok && TEACHER_FNS.indexOf(fn) >= 0;
  if (!HOSTED && teacherFn) {   // 비밀번호로 들어온 교사: 토큰과 함께 보냄
    return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(loginErr(e && e.message || e))).teacherCall(st.tok, fn, args[0]));
  }
  if (HOSTED && (teacherFn || fn === 'teacherLogin' || fn === 'teacherLogout')) {   // GitHub 화면의 교사용: 구글 페이지를 열지 않고 데이터만 주고받음
    return fetch(window.GAS_API, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, tok: fn === 'teacherLogout' ? args[0] : st.tok, arg: args[0] }) })
      .then(r => { if (!r.ok) throw new Error('서버 응답 오류 (' + r.status + ')'); return r.json(); })
      .then(j => { if (j && j.error) throw loginErr(j.error); return j.res; });
  }
  if (HOSTED) {
    const kind = fn === 'getVersion' ? 'ver' : fn === 'getPublicData' ? 'public' : null;
    if (!kind) return Promise.reject(new Error('이 화면에서는 볼 수만 있어요.'));
    return fetch(window.GAS_API + (window.GAS_API.indexOf('?') < 0 ? '?' : '&') + 'api=' + kind, { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error('서버 응답 오류 (' + r.status + ')'); return r.json(); })
      .then(j => { if (j && j.error) throw new Error(j.error); return kind === 'ver' ? j.ver : j; });
  }
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e && e.message ? e : new Error(String(e))))[fn](...args));
}

// ───────────────────────── 평면도 ─────────────────────────
const U = 44, PAD = 0.35, FAMILY = [['지구과학', '지구'], ['운동과 에너지', '운동'], ['물질', '물질'], ['생명과학', '생명'], ['공통', '공통'], ['학용품', '학용품']];
function cabLines(name) {

  if (/안전/.test(name)) return ['안전'];
  for (const [full, short] of FAMILY) { const m = name.match(new RegExp('^' + full + '\\s*(\\d+)$')); if (m) return [short, m[1]]; }
  const m = name.match(/^(\D+?)\s*(\d+)$/); return m ? [m[1], m[2]] : [name.replace(' 사물함', '')];
}
function famColor(name) {

  return /지구/.test(name) ? '#DCD3F5' : /운동/.test(name) ? '#CDE3F7' : /물질/.test(name) ? '#FFF0BF' : /생명/.test(name) ? '#D4EED8' :
    /공통/.test(name) ? '#FFE0CC' : /학용품/.test(name) ? '#F9D6E8' : /안전/.test(name) ? '#F8CDD3' : /시약/.test(name) ? '#E4E4EA' : '#EDEBF2';
}
function legendFor(cabs) {
  const seen = {};
  cabs.forEach(c => { const key = (c.box[4] || famColor(c.name)) + '|' + (cabLines(c.name).length > 1 ? c.name.replace(/\s*\d+$/, '') : c.name); seen[key] = true; });
  return '<div class="legend">' + Object.keys(seen).map(k => { const [col, n] = k.split('|'); return '<span><i style="background:' + esc(col) + '"></i>' + esc(n) + '</span>'; }).join('') + '</div>';
}
// 방 하나를 (ox, oy) 위치에 그림. 반환: { g, bubble }
// ── 배치도: 원본 표(세로로 쌓인 방)를 시계 방향으로 90° 돌려 가로로 그림 → 왼쪽부터 과학실·프로젝트실·준비실 ──
const PLAN_FONT = 'IBM Plex Sans KR, sans-serif';
function fitLines(name, ww, hh) {
  name = String(name || '').replace('운동과 에너지', '운동·에너지');
  let lines = [name], fs = Math.min(22, (ww - 10) / Math.max(1, name.length) * 1.05, hh * 0.52);
  if (fs < 12) {   // 한 줄로 작으면 "이름 / 번호" 두 줄
    const m = name.match(/^(.*?)\s*(\d+)$/);
    lines = m ? [m[1], m[2]] : name.split(' ');
    fs = Math.min(20, (ww - 8) / Math.max(...lines.map(l => l.length)) * 1.05, (hh - 6) / (lines.length * 1.2));
  }

}

  const lh = fs * 1.2, y0 = cy - (lines.length - 1) * lh / 2;
  return '<text text-anchor="middle" font-family="' + PLAN_FONT + '" font-weight="' + (weight || 600) + '" font-size="' + fs + '" fill="' + color + '">' +
    lines.map((l, i) => '<tspan x="' + cx + '" y="' + (y0 + i * lh) + '" dominant-baseline="central">' + esc(l) + '</tspan>').join('') + '</text>';
}
function planAll(hiCab, clickable, hiKan) {
  const d = st.data, WALL = 0.22, HEAD = 40;   // HEAD: 위쪽 방 이름 줄(px)
  const sizeOf = s => s.size || [Math.max(...d.cabs.filter(c => c.space === s.id && c.box).map(c => c.box[0] + c.box[2])), Math.max(...d.cabs.filter(c => c.space === s.id && c.box).map(c => c.box[1] + c.box[3]))];
  const order = (d.roomOrder || ['PREP', 'PROJ', 'LAB']).map(id => d.spaces.find(s => s.id === id)).filter(s => s && d.cabs.some(c => c.space === s.id && c.box))
    .map(s => Object.assign({}, s, { size: sizeOf(s) }));
  if (!order.length) return '';
  // 1) 원본 방향(세로 쌓기) 좌표 계산 — 단위: 칸
  const width = Math.max(...order.map(s => s.size[0]));
  let y = WALL + PAD; const top = {}, walls = [];
  order.forEach((s, i) => { top[s.id] = y; y += s.size[1] + PAD; if (i < order.length - 1) { walls.push({ y: y, up: s.id, down: order[i + 1].id }); y += WALL + PAD; } });
  const Ht = y + WALL, Wt = width + PAD * 2 + WALL * 2, ox = PAD + WALL;

  const Wpx = Ht * U, Hpx = Wt * U + HEAD, t = WALL * U;
  let g = '<rect x="0" y="0" width="' + Wpx + '" height="' + Hpx + '" fill="#fff"/>' +
    '<defs><pattern id="gpAll" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#F2EFFB" stroke-width="1"/></pattern></defs>' +
    '<rect x="' + t + '" y="' + (HEAD + t) + '" width="' + (Wpx - 2 * t) + '" height="' + (Hpx - HEAD - 2 * t) + '" fill="url(#gpAll)"/>';
  // 방 이름(배치도 위쪽)
  order.forEach(s => { const [rx, , rw] = R(0, top[s.id], 1, s.size[1]); g += textBlock(rx + rw / 2, HEAD / 2 + 2, [s.name], 24, '#7B5CFA', 700); });

  walls.forEach(wl => {

    if (!door) { g += '<line x1="' + xx + '" x2="' + xx + '" y1="' + HEAD + '" y2="' + Hpx + '" stroke="#3A3150" stroke-width="' + t + '"/>'; return; }
    const g0 = (door[2] + ox) * U + HEAD, g1 = g0 + door[3] * U;

  });

  let bubble = '';

  order.forEach(s => d.cabs.filter(c => c.space === s.id && c.box).forEach(c => {
    const col = c.box[4] || famColor(c.name), hi = c.id === hiCab;
    const [X0, Y0, W0, H0] = R(c.box[0] + ox, c.box[1] + top[s.id], c.box[2], c.box[3]);
    const X = X0 + 2, Y = Y0 + 2, ww = W0 - 4, hh = H0 - 4;
    g += '<g class="' + (clickable ? 'plan-cab' : '') + '" data-pcab="' + esc(c.id) + '"' + (clickable ? ' role="button" tabindex="0" aria-label="' + esc(c.name) + '"' : '') + '>' +
      '<rect' + (hi ? ' class="hi"' : '') + ' x="' + X + '" y="' + Y + '" width="' + ww + '" height="' + hh + '" rx="8" fill="' + (hi ? '#FF5C9E' : col) + '" stroke="' + (hi ? '#C81E5B' : '#6E6488') + '" stroke-width="' + (hi ? 3 : 1.3) + '"/>';
    const etcN = /^기타\s*(\d+)$/.exec(c.name);

        '<text x="' + (x + cw / 2) + '" y="' + (y + ch / 2) + '" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans KR, sans-serif" font-weight="600" font-size="' + Math.min(14, Math.floor((cw - 12) / Math.max(1, (hi ? 2 : 0) + String(k.name).length) * 1.1)) + '" fill="' + (hi ? '#ffffff' : '#3A3150') + '">' + esc(hi ? '▶ ' + k.name : k.name) + '</text>';

const isWaste = r => r && (r.waste === true || r.waste === 'TRUE');
const RF = ['전체', '사용 가능', '유해화학물질', '확인 필요', '유효기한', 'MSDS 미게시', '옮기기 권장', '폐기예정'];
const hasStock = r => r.base !== '' && r.base != null;
const stockTxt = r => hasStock(r) ? num(r.stock) + ' ' + esc(r.unit) : '재고 미입력';
// MSDS 비대상일 가능성이 큰 이름 (확정은 공급업체 확인)
const NOMSDS_RE = /(멸균|정제|탈이온|이온교환|초순수|증류)\s*(증류)?수|^\s*(순수|물)\s*$|DI\s*water|distilled/i;
const maybeNoMsds = n => NOMSDS_RE.test(String(n || ''));
const isYes = v => v === true || v === 'TRUE';
function rgFlags(r) {
  const f = [];
  if (r.haz === 'O') f.push(['유해화학물질', 'bad']);
  if (r.haz === '확인 필요') f.push(['유해 여부 확인', 'warn']);
  if (needConc(r)) f.push(['농도 확인', 'warn']);
  if (r.expState === '기한 지남') f.push(['기한 지남', 'bad']); else if (r.expState === '90일 이내') f.push(['기한 임박', 'warn']);
  if (isYes(r.noMsds)) f.push(['MSDS 비대상', '']);
  else if (!isYes(r.msds)) f.push([maybeNoMsds(r.name) ? 'MSDS 미게시 · 비대상일 수 있음' : 'MSDS 미게시', 'warn']);
  if (r.check === '옮기기 권장') f.push(['옮기기 권장', 'bad']);
  if (isWaste(r)) f.unshift(['폐기예정 · 사용 불가', 'bad']);
  if (/산화제/.test(r.prop)) f.push(['산화제', 'warn']);
  if (/인화성/.test(r.prop)) f.push(['인화성', 'warn']);
  return f;
}
function rgFilter(r) {
  switch (st.rf) {
    case '유해화학물질': return r.haz === 'O';
    case '확인 필요': return r.haz === '확인 필요' || needConc(r);
    case '유효기한': return r.expState === '기한 지남' || r.expState === '90일 이내';
    case 'MSDS 미게시': return !isYes(r.msds) && !isYes(r.noMsds);
    case '옮기기 권장': return r.check === '옮기기 권장';
    case '폐기예정': return isWaste(r);
    case '사용 가능': return !isWaste(r);
    default: return true;
  }
}

// 서버의 parseSpec_와 같은 규칙: "500 mL", "1 L", "1 kg" → 한 병 양(관리단위)
function specPer(spec) {
  const m = String(spec || '').replace(/\s+/g, ' ').trim().match(/^([\d.,]+)\s*(mL|ml|ML|L|l|g|kg|KG)$/);
  if (!m) return null;
  let v = Number(m[1].replace(/,/g, '')), u = m[2];
  if (/^ml$/i.test(u)) u = 'mL'; else if (/^l$/i.test(u)) { v *= 1000; u = 'mL'; } else if (/^kg$/i.test(u)) { v *= 1000; u = 'g'; }
  return isNaN(v) ? null : { per: v, unit: u };
}

// 여러 성분 중 이 시약의 주성분 고르기: 물 제외 → [부록9]에서 시약명으로 찾은 물질의 CAS → 이름이 겹치는 성분 → 함유량이 큰 성분
function mainComp(comps, name) {
  const c = comps.filter(x => !x.water); if (c.length <= 1) return c[0] || null;
  const std = findStd(name, '', ''), cas = std.map(x => x.cas);
  const byStd = c.find(x => cas.indexOf(x.cas) >= 0); if (byStd) return byStd;
  const n = hzNorm(name), byName = c.find(x => x.name && n.indexOf(hzNorm(x.name).replace(/\(.*$/, '')) >= 0); if (byName) return byName;
  const hi = x => Number(String(x.pct).split('~').pop()) || 0;
  return c.slice().sort((a, b) => hi(b) - hi(a))[0];
}

// 폼에 붙이기: 시약명·농도·화학식·CAS가 바뀌면 판정을 보여 주고, 선생님이 직접 고르지 않았으면 유해화학물질 여부를 자동으로 채움
function hookHaz(f) {

  let touched = !!sel.value && sel.value !== '확인 필요';
  sel.addEventListener('change', e => { if (e.isTrusted) touched = true; run(); });
  const val = k => { const el = f.querySelector('[name=' + k + ']'); return el ? el.value : ''; };
  function run() {
    const j = judgeHaz(val('name'), val('conc'), val('formula'), val('cas'));
    if (!touched && j.verdict) sel.value = j.verdict;
    box.style.display = j.html ? '' : 'none';
    box.innerHTML = j.html ? '<b>자동 판정' + (j.verdict ? ': ' + esc(j.verdict) : '') + '</b>' + (touched && j.verdict && sel.value !== j.verdict ? ' <span style="color:var(--warn)">(직접 고른 값 "' + esc(sel.value) + '"과 달라요)</span>' : '') +

// ───────────────────────── 에듀파인 (경기도 과학교구·설비 기준 · 교구 수불) ─────────────────────────
// 기준표: 경기도교육청 고시 제2025-569호 중학교 — 교구 125 · 안전장구 15 · 기자재 6 · 설비 18 (필수 79종)
const EDU_START = '2026-03-01';
const AREA_ORDER = ['안전장구', '공통(기자재)', '공통-일반교구', '공통-측정교구', '물질', '생명', '운동과 에너지', '지구와 우주', '안전설비', '일반설비'];
const STD_SKIP_CAT = ['학용품', '기타'];   // 자동 연결에서 빼는 교구 분류
function stdMap() {
  const d = st.data;
  if (d._stdSrc !== d.std) { d._stdMap = {}; (d.std || []).forEach(s => d._stdMap[s.code] = s); d._stdSrc = d.std; }
  return d._stdMap;
}
const stdOf = it => it && it.std ? stdMap()[it.std] || null : null;
const reqBadge = s => s ? '<span class="b ' + (s.req === '필수' ? 'req1' : 'req2') + '">' + esc(s.req) + '</span>' : '';
const isEquip = s => s && s.kind === '설비';
const eduOf = code => (st.data.edu || []).filter(r => r.code === code);

const linkedOf = code => st.data.items.filter(it => it.std === code);

const isDone = r => r.eduDone === true || r.eduDone === 'TRUE';
const areaRank = a => { const i = AREA_ORDER.indexOf(a); return i < 0 ? 99 : i; };

// ── 교구 이름 → 기준 종목 자동 연결 ──
const STD_SYN = { '헤어드라이기': '헤어드라이어', '감압용기': '감압 실험 용기', '뷰렛클램프': '뷰렛 집게', '폐모형': '폐운동 원리 실험장치',
  '플라스틱관': '투명한 플라스틱 관', '구급함': '구급약품함', '방화사': '소화용 모래', '소방포': '방염담요', '금속추': '역학용 금속추',
  '검전기': '금속박 검전기', '구리판': '금속판', '아연판': '금속판', '철판': '금속판', '막자': '막자와 막자사발', '막자사발': '막자와 막자사발',
  '멀티현미경': '멀티미디어 영상 현미경', '깔대기': '깔때기', '깔대기대': '깔때기대', '백열등': '적외선등(또는 백열등)', '소화용모래': '소화용 모래',
  '프로젝터': 'TV', '빔프로젝터': 'TV', '실험복': '실험복', '방독마스크': '마스크2', '방진마스크': '마스크1', '마스크': '마스크1' };
const STD_NOT = /충전기|리필|팁$|거치대/;
const stdKey = s => String(s || '').toLowerCase().replace(/[\s·.,_\-]/g, '');
const itemCore = s => stdKey(String(s || '').replace(/\([^)]*\)/g, '').replace(/[\d,.]+\s*(ml|l|mm|cm|g|kg|홀|구|w|v|Ω|pcs|색)/gi, '').replace(/\d+종/g, '').replace(/세트$/, ''));
function stdAliases(s) {
  const n = s.name, out = [stdKey(n)];
  const base = n.replace(/\([^)]*\)/g, '').trim(), inner = (n.match(/\(([^)]*)\)/) || [])[1] || '';
  if (/^또는\s*/.test(inner)) out.push(stdKey(base), stdKey(inner.replace(/^또는\s*/, '')));
  else if (inner) { out.push(stdKey(inner + base), stdKey(base + inner)); if (/[가-힣]{2,}/.test(inner) && !/[,·]/.test(inner) && inner.length > 2) out.push(stdKey(inner)); out.push('#' + stdKey(base)); }
  else out.push(stdKey(base));
  return out;
}
// → { code, sure } · { many:[…] } · null
function matchStd(name, std) {
  std = (std || st.data.std || []).filter(s => !isEquip(s));
  const raw = stdKey(name), core = itemCore(name), syn = STD_SYN[core] || STD_SYN[raw], cand = [];
  std.forEach(s => stdAliases(s).forEach(a => {
    const weak = a[0] === '#'; if (weak) a = a.slice(1); if (a.length < 2) return;
    let sc = 0;
    if (syn && stdKey(syn) === stdKey(s.name)) sc = 1000;
    else if (STD_NOT.test(name) && !STD_NOT.test(s.name)) sc = 0;
    else if (a === raw || a === core) sc = weak ? 300 : 500 + a.length;
    else if (raw.indexOf(a) === 0 || core.indexOf(a) === 0) sc = (weak ? 100 : 200) + a.length;
    else if (a.length >= 3 && raw.indexOf(a) > 0) sc = 50 + a.length;
    else if (core.length >= 4 && a.indexOf(core) === 0) sc = 40 + core.length;
    if (sc) cand.push({ code: s.code, sc: sc });
  }));
  if (!cand.length) return null;
  cand.sort((a, b) => b.sc - a.sc);
  const top = cand[0].sc, best = cand.filter(c => c.sc === top).map(c => c.code).filter((c, i, a) => a.indexOf(c) === i);
  return best.length === 1 ? { code: best[0], sure: top >= 200 } : { many: best };
}

    const local = Object.assign({}, rec || {}, obj, { label: code + ' ' + s.name, qty: q, price: obj.price === '' ? '' : Number(obj.price), _pending: true });
    const snap = d.edu.slice();
    if (rec) d.edu[d.edu.indexOf(rec)] = local; else { d.edu.push(local); d.edu.sort((a, b) => String(a.date).localeCompare(String(b.date))); }
    stdDetail(code); rerender();
    save('saveEdu', obj, res => { d.edu = res.edu; rerender(); if ($('#addEdu')) stdDetail(code); toast('저장했어요 · ' + s.name); },
      e => { d.edu = snap; rerender(); toast('저장하지 못했어요: ' + e.message, true); eduForm(code, rec); });
  };
}

// ── 교구 자동 연결 ──
function linkAuto() {
  const d = st.data, M = stdMap();
  const cand = d.items.filter(it => !it.std && STD_SKIP_CAT.indexOf(it.cat) < 0 && !it._pending).map(it => ({ it: it, m: matchStd(it.name) })).filter(x => x.m);
  const one = cand.filter(x => x.m.code), many = cand.filter(x => x.m.many);
  const left = d.items.filter(it => !it.std && STD_SKIP_CAT.indexOf(it.cat) < 0).length - cand.length;
  openModal('<h2>교구 자동 연결</h2><p class="note">교구 이름으로 기준표 종목을 찾았어요. 맞는 것만 체크된 채로 두고 <b>연결</b>을 눌러요. 비커 250·500·1000 mL처럼 여러 교구가 한 종목에 연결돼도 돼요(에듀파인은 종목 단위).</p>' +
    (one.length ? '<div class="scroll"><table class="mini"><tr><th><input type="checkbox" id="laAll" checked aria-label="모두"></th><th>우리 교구</th><th>기준 종목</th></tr>' +
      one.map((x, i) => { const s = M[x.m.code]; return '<tr><td><input type="checkbox" data-la="' + i + '"' + (x.m.sure ? ' checked' : '') + '></td><td>' + esc(x.it.name) + ' <span class="note">' + esc(x.it.cat) + '</span></td><td>' + esc(s.name) + ' ' + reqBadge(s) + (x.m.sure ? '' : ' <span class="b warn">확인</span>') + '</td></tr>'; }).join('') + '</table></div>'
      : '<p class="note">새로 연결할 교구를 찾지 못했어요.</p>') +
    (many.length ? '<div class="sec">여러 종목에 걸치는 교구</div><p class="note">한 교구가 한 종목에만 연결돼요. 고르거나, 교구를 종목별로 나눠 등록해 주세요.</p>' +
      many.map((x, i) => '<div style="display:flex;gap:8px;align-items:center;margin:4px 0"><span style="flex:1">' + esc(x.it.name) + '</span><select data-lm="' + i + '" style="border:2px solid var(--line);border-radius:10px;padding:5px"><option value="">— 안 함</option>' +
        x.m.many.map(c => '<option value="' + esc(c) + '">' + esc(M[c].name) + ' · ' + esc(M[c].req) + '</option>').join('') + '</select></div>').join('') : '') +
    '<p class="note" style="margin-top:10px">못 찾은 교구 ' + left + '개(학용품·기타 제외)는 기준 외이거나 이름이 달라요. 교구를 눌러 [수정]에서 직접 고를 수 있어요.</p>' +
    '<div class="btns"><button class="btn" data-close>닫기</button><button class="btn pri" id="laOk">연결</button></div>');
  const boxes = () => Array.from($('#modal').querySelectorAll('[data-la]'));
  const all = $('#laAll'); if (all) { all.checked = boxes().every(b => b.checked); all.onchange = () => boxes().forEach(b => b.checked = all.checked); }
  $('#laOk').onclick = () => {
    const links = boxes().filter(b => b.checked).map(b => ({ id: one[Number(b.dataset.la)].it.id, code: one[Number(b.dataset.la)].m.code }))
      .concat(Array.from($('#modal').querySelectorAll('[data-lm]')).filter(s => s.value).map(s => ({ id: many[Number(s.dataset.lm)].it.id, code: s.value })));
    if (!links.length) return toast('연결할 교구를 골라 주세요.', true);
    closeModal(); linkSave(links);
  };
}

// ── 처음 등록: 기록 없는 종목을 한꺼번에 '취득'으로 ──
function bulkStart() {
  const d = st.data;
  const list = d.std.filter(s => !isEquip(s) && !eduOf(s.code).length).sort((a, b) => (areaRank(a.area) - areaRank(b.area)));
  const withItems = list.filter(s => linkedOf(s.code).length), mustZero = list.filter(s => !linkedOf(s.code).length && s.req === '필수');
  openModal('<h2>처음 등록 만들기</h2><p class="note">수불 기록이 없는 종목에 <b>취득</b> 줄을 한꺼번에 만들어요. 이미 기록이 있는 종목은 건너뛰어요. 수량은 고칠 수 있어요.</p>' +
    '<div class="form" id="bf"><label data-f="date">수불일자<span class="req">*</span><input type="date" name="date" value="' + EDU_START + '"></label></div>' +
    '<label class="chk" style="display:flex;gap:8px;margin:10px 0 4px"><input type="checkbox" id="bA" checked><span><b>우리 교구가 연결된 종목 ' + withItems.length + '개</b> — 교구 시트 수량 합으로</span></label>' +
    '<label class="chk" style="display:flex;gap:8px;margin:4px 0 10px"><input type="checkbox" id="bB" checked><span><b>교구가 없는 필수 종목 ' + mustZero.length + '개</b> — 0개 취득 <span class="note">(가이드: 기록이 없으면 필수 종수에 안 들어가요)</span></span></label>' +
    '<div class="scroll" style="max-height:44vh;overflow:auto"><table class="mini" id="bt"><tr><th></th><th>영역</th><th>종목</th><th>수량</th><th>세부규격</th></tr>' +
      withItems.concat(mustZero).map(s => { const has = linkedOf(s.code).length;
        return '<tr data-grp="' + (has ? 'A' : 'B') + '"><td><input type="checkbox" data-b="' + esc(s.code) + '" checked></td><td>' + esc(s.area) + '</td><td>' + esc(s.name) + ' ' + reqBadge(s) + '</td>' +
          '<td><input type="number" min="0" step="1" data-bq="' + esc(s.code) + '" value="' + (has ? linkedQty(s.code) : 0) + '" style="width:76px;border:1.5px solid var(--line);border-radius:8px;padding:4px"></td>' +
          '<td><input data-bs="' + esc(s.code) + '" value="' + esc(has ? linkedOf(s.code).map(it => it.name.replace(s.name, '').replace(/^[\s(]+|[\s)]+$/g, '')).filter(Boolean).join(', ') : '') + '" style="width:150px;border:1.5px solid var(--line);border-radius:8px;padding:4px"></td></tr>'; }).join('') +
    '</table></div><div class="btns"><button class="btn" data-close>취소</button><button class="btn pri" id="bOk">취득 기록 만들기</button></div>');
  const grp = (g, on) => $('#bt').querySelectorAll('tr[data-grp="' + g + '"] [data-b]').forEach(c => c.checked = on);
  $('#bA').onchange = e => grp('A', e.target.checked); $('#bB').onchange = e => grp('B', e.target.checked);
  $('#bOk').onclick = () => {
    const date = $('#bf [name=date]').value; if (!date) return toast('수불일자를 넣어 주세요.', true);
    const pick = Array.from($('#bt').querySelectorAll('[data-b]')).filter(c => c.checked).map(c => { const code = c.dataset.b;
      return { code: code, qty: Number($('#bt').querySelector('[data-bq="' + code + '"]').value) || 0, spec: $('#bt').querySelector('[data-bs="' + code + '"]').value.trim(), note: '보유 수량 등록' }; });
    if (!pick.length) return toast('만들 종목을 골라 주세요.', true);
    const b = $('#bOk'); busy(b, true);
    save('bulkAcquire', { date: date, list: pick }, res => { d.edu = res.edu; closeModal(); rerender(); toast(res.added + '종목의 취득 기록을 만들었어요. [에듀파인 입력할 목록]에서 차례로 넣어요.'); },
      e => { busy(b, false); toast('만들지 못했어요: ' + e.message, true); });
  };
}
function eduConfForm() {
  const d = st.data, c = d.eduConf || {};
  const F = [{ k: 'students', label: '학급당 최대 학생 수', type: 'number', req: true }, { k: 'labs', label: '실험실 수', type: 'number', req: true }, { k: 'preps', label: '준비실 수', type: 'number' }];
  openModal('<h2>학교보유율 산정 기초정보</h2><p class="note">에듀파인 <b>교구기준관리 › 학교보유율산정기초정보관리</b>에 넣는 값과 같아요. 여기서는 예상 소요수량(참고값)을 계산하는 데 써요. 중학교 학급 수 1~10학급 1실, 11~20학급 2실, 21학급 이상 3실.</p>' +
    '<div class="form" id="f">' + REQNOTE + F.map(f => field(f, c[f.k] === undefined ? '' : c[f.k])).join('') + '</div>' +
    '<div class="btns"><button class="btn" data-close>취소</button><button class="btn pri" id="save">저장</button></div>');
  $('#save').onclick = () => {
    const obj = readForm($('#f'), F); if (!checkReq($('#f'), F, obj)) return;
    const b = $('#save'); busy(b, true);
    save('saveEduConf', obj, res => { d.std = res.std; d.eduConf = res.eduConf; closeModal(); rerender(); toast('저장했어요. 예상 소요수량을 다시 계산했어요.'); }, e => { busy(b, false); toast('저장하지 못했어요: ' + e.message, true); });
  };
}

  openModal('<h2>K-에듀파인 입력 순서</h2><p class="note">2026 K-에듀파인 과학교구·설비 기준 처리 가이드(학교 담당자용) 요약</p><ol style="padding-left:20px;font-size:14.5px;line-height:1.7">' +
    '<li><b>학교보유율산정기초정보관리</b>: 실험실 수·실험대 수·교사 수·학급당 최대 학생 수 → 일괄적용</li>' +
    '<li><b>학교교구기준관리</b>: 과목 <b>과학(2025)</b> → 영역(안전장구, 공통(기자재), 공통-일반교구, 공통-측정교구, 물질, 생명, 운동과 에너지, 지구와 우주)마다 전체 선택 → 기준내 등록 → 소요수량계산</li>' +
    '<li><b>학교설비기준관리</b>: 설비 과학(2025) → 안전설비·일반설비 → 소요수량계산 → 종목마다 <b>보유량</b> 입력·저장 (이 앱의 <b>설비</b> 칩)</li>' +
    '<li><b>교구수불관리</b>: 과학(2025) → 필수 구분 → 조회(전체 기간) → 종목 선택 → 행추가 → 수불일자·구분·수량·단가·세부규격·비고 → 저장 (이 앱의 <b>에듀파인 입력할 목록</b>)</li>' +
    '<li><b>교구확충계획관리</b>: 3년 확충 계획 (필수 안전장구·안전설비 빠지지 않게)</li>' +
    '<li><b>교구보고자료제출</b>: 교구보고자료(과학)·설비보고자료 각각 집계 → 결재요청 → 제출. 기준량 <b>중학교 79종</b>이 나와야 해요.</li></ol>' +
    '<div class="alert warn">수불 기록이 없는 교구는 필수 종수에 안 들어가요 → ' + EDU_START + ' 이후 날짜로 <b>0개 취득</b>이라도 넣어요. (가장 많이 묻는 질문)</div>' +
    '<p class="note">문의: K-에듀파인 지원서비스 1566-0066 (1번 학교회계 → 4번 통합자산관리) · 2차 교육지원청 과학교구관리 지원단<br>※ 이 앱의 기자재 코드(기자재1~6)와 설비 코드(설비1~18)는 앱에서 구분하려고 붙인 번호예요. 에듀파인에서는 이름으로 찾아요.</p>' +
    '<div class="btns"><button class="btn pri" data-close>확인</button></div>');
}

// ───────────────────────── 점검 ─────────────────────────
function viewCheck() {
  const d = st.data, R = d.reagents, yes = v => v === true || v === 'TRUE';
  const groups = [
    ['유효기한 지남', R.filter(r => r.expState === '기한 지남'), 'bad', '유효기한'],
    ['유효기한 90일 이내', R.filter(r => r.expState === '90일 이내'), 'warn', '유효기한'],
    ['유해화학물질(O)', R.filter(r => r.haz === 'O'), 'bad', '유해화학물질'],
    ['유해 여부·농도 확인 필요', R.filter(r => r.haz === '확인 필요' || needConc(r)), 'warn', '확인 필요'],
    ['MSDS 미게시', R.filter(r => !yes(r.msds) && !yes(r.noMsds)), 'warn', 'MSDS 미게시'],
    ['보관 위치 옮기기 권장', R.filter(r => r.check === '옮기기 권장'), 'bad', '옮기기 권장'],
    ['추천 칸 미설정', R.filter(r => r.check === '추천 칸 미설정'), '', null],
    ['폐기예정 시약', R.filter(r => yes(r.waste)), '', '폐기예정'],
    ['확인이 필요한 교구', d.items.filter(i => /확인/.test(i.note || '')), 'warn', null]
  ];
  const haz = R.some(r => r.haz === 'O');
  $('#main').innerHTML = '<div class="alert ' + (haz ? 'bad' : 'ac') + '">유해화학물질 보유 여부: <b>' + (haz ? '○ (보유)' : '× (미보유)') + '</b>' +
    (haz ? ' — 별도 보관·이중 잠금·취급주의 표시, 취급시설 자체점검 주 1회(조례 제6조②), 서식2 보고 시 "○"로 표시' : '') + '</div>' +
    '<div class="stats">' + groups.map((g, i) => '<button class="stat" data-g="' + i + '"><div class="v" style="color:' + (g[1].length && g[2] === 'bad' ? 'var(--bad)' : g[1].length && g[2] === 'warn' ? 'var(--warn)' : 'inherit') + '">' + g[1].length + '</div><div class="l">' + g[0] + '</div></button>').join('') + '</div>' +
    '<div id="glist"></div>' +
    '<div class="panel"><h3>정기 점검 일정 (2026 과학실 안전관리 계획)</h3><ul class="note" style="margin:0;padding-left:18px">' +
      '<li>매월 4일: 과학실험실 안전관리 자체 점검표(서식1), 폐수·폐기물 자체 점검표(서식5)</li>' +
      '<li>출납대장(서식3) 5년, 폐수·폐시약 관리대장(서식4) 3년 보존</li>' +
      '<li>상·하반기 안전점검 운영 실적(서식2) 교육지원청 제출</li>' +
      (haz ? '<li>유해화학물질 취급시설 자체점검 주 1회 이상</li>' : '') +
    '</ul><p class="note"><a href="' + esc(d.sheetUrl) + '" target="_blank">구글 시트 열기</a> — 출납대장_출력, 폐수대장_출력, 시약장_목록표 시트에서 인쇄할 수 있어요.</p></div>';
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    const g = groups[Number(b.dataset.g)];
    $('#glist').innerHTML = '<div class="panel"><h3>' + g[0] + ' (' + g[1].length + ')</h3>' + (g[1].length ? '<div class="list">' + g[1].map(x => x.formula !== undefined
      ? '<button class="card" data-rg="' + esc(x.id) + '"><div class="t"><span class="n">' + esc(x.name) + '</span><span class="q">' + esc(x.exp || '') + '</span></div><div class="p">' + esc(x.loc) + '</div></button>'
      : '<button class="card" data-item="' + esc(x.id) + '"><div class="t"><span class="n">' + esc(x.name) + '</span></div><div class="p">' + esc(x.note) + '</div></button>').join('') + '</div>' : '<p class="note">해당 없음</p>') + '</div>';
    $('#glist').querySelectorAll('[data-rg]').forEach(c => c.onclick = () => rgDetail(c.dataset.rg));
    bindItemCards($('#glist'));
    $('#glist').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

start();
})();
</script>
