<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과학실 교구 검색</title>
<script>
  // ▼ 여기 세 줄만 바꾸세요 ▼
  const STUDENT_URL = 'https://script.google.com/macros/s/AKfycbxi2tfuTqiyU34Ob409rF71JOqjRSp0SNODBJqESWkqFRyEuMOQlXEA8bkiLxk_77gKGw/exec';   // 학생용 웹 앱 주소 (https://script.google.com/macros/s/.../exec)
  const TEACHER_URL = 'https://script.google.com/macros/s/AKfycbxSj59Eosmm57pNtGLEvznjfoprXuQienQwMGw2CcoQ25roobd0ouNx97Y4vVkyYw1Tag/exec';   // 교사용 웹 앱 주소 (비워 두면 선생님 버튼이 안 보여요)
  const SCHOOL = '경민여자중학교';        // 학교 이름 (예: ○○중학교)
  // ▲ 여기까지 ▲

  // 주소 뒤에 ?teacher 를 붙이면 교사용으로, ?stay 를 붙이면 이 안내 화면에 머뭅니다.
  const q = location.search;
  if (q.indexOf('teacher') >= 0 && TEACHER_URL) location.replace(TEACHER_URL);
  else if (q.indexOf('stay') < 0 && STUDENT_URL) location.replace(STUDENT_URL);
</script>
<style>
  :root{--bg:#f6f7f5;--ink:#1d2321;--muted:#66706c;--accent:#0f6e5a;--line:#e2e6e3}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  main{max-width:420px;width:100%;text-align:center}
  h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em} p{color:var(--muted);margin:0 0 24px;line-height:1.6}
  a.btn{display:block;padding:16px;border-radius:12px;text-decoration:none;font-size:18px;font-weight:600;margin-bottom:10px}
  a.pri{background:var(--accent);color:#fff} a.sec{background:#fff;color:var(--ink);border:1px solid var(--line);font-size:15px;font-weight:500}
  .warn{background:#fdf0dc;color:#7a3e05;border-radius:10px;padding:12px;font-size:14px;text-align:left}
</style>
</head>
<body>
<main>
  <h1>과학실 교구 검색</h1>
  <p id="sub">찾는 교구가 어느 사물함, 몇 번째 칸에 있는지 알려 줘요.</p>
  <div id="btns"></div>
</main>
<script>
  if (SCHOOL) document.getElementById('sub').textContent = SCHOOL + ' 과학실 · 찾는 교구가 어느 사물함, 몇 번째 칸에 있는지 알려 줘요.';
  const box = document.getElementById('btns');
  if (!STUDENT_URL) {
    box.innerHTML = '<div class="warn">아직 학생용 주소가 설정되지 않았어요. index.html 맨 위의 STUDENT_URL에 학생용 웹 앱 주소를 넣어 주세요.</div>';
  } else {
    box.innerHTML = '<a class="btn pri" href="' + STUDENT_URL + '">교구 찾기</a>' +
      (TEACHER_URL ? '<a class="btn sec" href="' + TEACHER_URL + '">선생님용 (로그인 필요)</a>' : '');
  }
</script>
</body>
</html>
