<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과학실 교구 검색</title>
<style>
  :root{--bg:#f6f7f5;--card:#fff;--ink:#1d2321;--muted:#66706c;--line:#e2e6e3;--accent:#0f6e5a;--accent-soft:#e3f2ed;
    --warn:#b45309;--warn-soft:#fdf0dc;--bad:#b42318;--bad-soft:#fde8e6;--ok:#1a7f37;--ok-soft:#e6f4ea;--r:12px}
  *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.5}
  button,input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:16px}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:20px 16px 8px;max-width:880px;margin:0 auto}
  header.top h1{margin:0;font-size:22px;letter-spacing:-.02em} header.top .sub{color:var(--muted);font-size:14px}
  header.top .who{font-size:13px;color:var(--muted);text-align:right}
  header.top .who a{color:var(--accent)}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 0;max-width:880px;margin:0 auto;scrollbar-width:none}
  .tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;white-space:nowrap;cursor:pointer;font-size:15px}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .search{position:relative;margin:8px 0 10px}
  .search input{width:100%;padding:14px 44px 14px 16px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);font-size:17px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer;padding:6px 10px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .hint{color:var(--muted);font-size:13px;margin:4px 2px 12px}
  .list{display:flex;flex-direction:column;gap:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;width:100%}
  .card:hover{border-color:#c8d0cc}
  .card .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .card .n{font-weight:600;font-size:16.5px} .card .q{color:var(--muted);font-size:14px;white-space:nowrap}
  .card .p{color:var(--muted);font-size:14px;margin-top:2px}
  .card .p b{color:var(--ink);font-weight:600}
  .badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .b{font-size:12px;border-radius:6px;padding:1px 7px;background:#eef0ef;color:#3e4643}
  .b.bad{background:var(--bad-soft);color:var(--bad)} .b.warn{background:var(--warn-soft);color:var(--warn)}
  .b.ok{background:var(--ok-soft);color:var(--ok)} .b.ac{background:var(--accent-soft);color:var(--accent)}
  mark{background:#fff1a8;padding:0 1px;border-radius:2px}
  .empty{color:var(--muted);text-align:center;padding:40px 10px}
  .group h3{font-size:15px;margin:18px 2px 8px;color:var(--muted);font-weight:600}
  .cabbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
  .cabbox summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
  .cabbox summary::-webkit-details-marker{display:none}
  .cabbox .kan{padding:6px 14px 10px;border-top:1px solid var(--line)}
  .cabbox .kan .kn{font-size:13px;color:var(--muted);margin:6px 0 2px}
  .cabbox .kan button{border:0;background:none;padding:3px 0;cursor:pointer;display:block;text-align:left;color:var(--ink)}
  .modal-bg{position:fixed;inset:0;background:rgba(20,25,23,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  @media(min-width:700px){.modal-bg{align-items:center}}
  .modal{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px 22px}
  @media(min-width:700px){.modal{border-radius:16px}}
  .modal h2{margin:0 0 4px;font-size:20px} .modal .close{float:right;border:0;background:none;font-size:24px;cursor:pointer;color:var(--muted);margin:-6px -6px 0 0}
  .path{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0}
  .path div{background:var(--accent-soft);border-radius:10px;padding:10px;text-align:center}
  .path small{display:block;color:var(--accent);font-size:12px} .path strong{font-size:17px}
  .plan{width:100%;border-radius:10px;border:1px solid var(--line);margin-top:8px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:14.5px;margin:10px 0}
  .kv dt{color:var(--muted)} .kv dd{margin:0}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:12px}
  .form label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px}
  .form label.full{grid-column:1/-1}
  .form input,.form select,.form textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;font-size:15px;color:var(--ink)}
  .form .chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:15px}
  @media(max-width:520px){.form{grid-template-columns:1fr}}
  .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;cursor:pointer;font-size:15px}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0 10px;flex-wrap:wrap}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
  .panel h3{margin:0 0 8px;font-size:16px}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left}
  .stat .v{font-size:24px;font-weight:700} .stat .l{font-size:13px;color:var(--muted)}
  table.mini{width:100%;border-collapse:collapse;font-size:14px}
  table.mini th,table.mini td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
  table.mini th{color:var(--muted);font-weight:500;font-size:13px}
  .scroll{overflow-x:auto}
  .note{font-size:13px;color:var(--muted)}
  .alert{border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
  .alert.warn{background:var(--warn-soft);color:#7a3e05} .alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.ac{background:var(--accent-soft);color:#0b4f41}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;max-width:90vw;display:none}
  #toast.err{background:var(--bad)}
  .planbox{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fbfcfa;margin-top:8px;-webkit-overflow-scrolling:touch}
  .planbox svg{display:block;min-width:540px;width:100%;height:auto}
  .planbox.fit svg{min-width:0}
  .room h3{font-size:17px;margin:18px 2px 0}
  .cabsvg{margin-top:8px;overflow-x:auto} .cabsvg svg{display:block;margin:0 auto;max-width:100%;height:auto}
  .sec{font-size:13px;color:var(--muted);margin:16px 0 2px;font-weight:600}
  .swipe{font-weight:400;display:none} @media(max-width:600px){.swipe{display:inline}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}} .hi{animation:pulse 1.1s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){.hi{animation:none}}
  .plan-cab{cursor:pointer}
  .pending{opacity:.62} tr.pending td{color:var(--muted)}
  .loading{text-align:center;color:var(--muted);padding:60px 0}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<nav class="tabs" id="tabs"></nav>
<main class="wrap" id="main"><div class="loading"><div class="spin"></div>불러오는 중…</div></main>
<div id="modal"></div>
<div id="toast"></div>
<script src="config.js"></script>
<script>
  // 주소는 config.js 파일에 적어 주세요. (config.js가 없으면 아래 값을 씁니다)
  if (typeof window.GAS_API !== 'string') window.GAS_API = '';
  if (typeof window.TEACHER_URL !== 'string') window.TEACHER_URL = '';
  const BOOT = { mode: 'student', data: null, studentUrl: '' };
</script>
<script>
(function(){
'use strict';
const st = { mode: BOOT.mode, data: null, tab: 'items', q: '', cat: '전체', view: 'search', rq: '', rf: '전체', logRid: '' };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === '' || v == null) ? '' : (Math.round(Number(v) * 100) / 100).toLocaleString('ko-KR');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };

// ── 검색(초성 포함) ──
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '');
const cho = s => Array.from(String(s || '')).map(ch => { const c = ch.charCodeAt(0) - 0xAC00; return (c >= 0 && c < 11172) ? CHO[Math.floor(c / 588)] : ch; }).join('');
const isCho = q => /^[ㄱ-ㅎ]+$/.test(q);
function matches(q, ...fields) {
  q = norm(q); if (!q) return true;
  const text = norm(fields.join(' '));
  return isCho(q) ? cho(text).includes(q) : text.includes(q);
}
function hl(text, q) {
  text = String(text || ''); q = String(q || '').trim();
  if (!q || isCho(norm(q))) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}

// ── 서버 호출 ──
const HOSTED = typeof window.GAS_API === 'string';   // GitHub 등 외부에 올린 학생용 화면
function call(fn, ...args) {
  if (HOSTED) {
    const kind = fn === 'getVersion' ? 'ver' : fn === 'getPublicData' ? 'public' : null;
    if (!kind) return Promise.reject(new Error('이 화면에서는 볼 수만 있어요.'));
    return fetch(window.GAS_API + (window.GAS_API.indexOf('?') < 0 ? '?' : '&') + 'api=' + kind, { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error('서버 응답 오류 (' + r.status + ')'); return r.json(); })
      .then(j => { if (j && j.error) throw new Error(j.error); return kind === 'ver' ? j.ver : j; });
  }
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e && e.message ? e : new Error(String(e))))[fn](...args));
}
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', err ? 6000 : 2600); }
function closeModal() { $('#modal').innerHTML = ''; if (st.dirty) { st.dirty = false; rerender(); } }
// 입력 중인 칸의 포커스를 지키면서 다시 그리기
function rerender() {
  if (!st.data) return;
  if ($('#modal').innerHTML) { st.dirty = true; return; }
  const a = document.activeElement, id = a && a.id, pos = a && a.selectionStart;
  render();
  if (id) { const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} } }
}

// ── 동기화: 시트가 바뀌면(버전 변경) 새 내용을 받아 옴 ──
st.saving = 0;
function dataFn() { return st.mode === 'teacher' ? 'getTeacherData' : 'getPublicData'; }
function refresh() {
  return call(dataFn()).then(d => { if (st.saving > 0) { st.stale = true; return; } st.data = d; st.ver = d.ver; saveCache(d); rerender(); }).catch(() => {});
}
function poll() {
  if (document.hidden || st.saving > 0 || !st.data) return;
  call('getVersion').then(v => { if (String(v) !== String(st.ver)) refresh(); }).catch(() => {});
}
function loadCache() { if (!HOSTED) return null; try { return JSON.parse(localStorage.getItem('sci_pub') || 'null'); } catch (e) { return null; } }
function saveCache(d) { if (!HOSTED) return; try { localStorage.setItem('sci_pub', JSON.stringify(d)); } catch (e) {} }
let syncing = false;
function startSync() {
  if (syncing) return; syncing = true;
  setInterval(poll, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
}
// 저장 요청을 보내고, 화면은 이미 바뀐 상태로 둔다. 실패하면 되돌린다.
function save(fn, arg, onOk, onFail) {
  st.saving++;
  return call(fn, arg).then(res => {
    st.saving--;
    const others = String(res.prevVer) !== String(st.ver);
    st.ver = res.ver;
    onOk(res);
    if ((others || st.stale) && st.saving === 0) { st.stale = false; refresh(); }
  }).catch(err => { st.saving--; onFail(err); });
}
const KAN = id => (st.data.kans || []).find(k => k.id === id);
function placeOf(kanId) {
  const k = KAN(kanId); if (!k) return { kanName: '', cabName: '', spaceName: '', cab: '', space: '', cabDesc: '' };
  const p = k.label.split(' › '); const c = st.data.cabs.find(x => x.id === k.cab) || {};
  return { spaceName: p[0] || '', cabName: p[1] || '', kanName: p.slice(2).join(' › '), cab: k.cab, space: c.space || '', cabDesc: c.desc || '' };
}
const driveImg = l => { l = String(l || '').trim(); const m = l.match(/\/d\/([\w-]{20,})/) || l.match(/[?&]id=([\w-]{20,})/); return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1600' : l; };
const pend = x => x && x._pending ? ' <span class="b ac">저장 중</span>' : '';
function openModal(html) {
  $('#modal').innerHTML = '<div class="modal-bg" data-bg><div class="modal" role="dialog" aria-modal="true"><button class="close" aria-label="닫기" data-close>×</button>' + html + '</div></div>';
}
document.addEventListener('click', e => {
  if (e.target.matches('[data-close]') || e.target.matches('[data-bg]')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── 시작 ──
function start() {
  if (st.mode === 'denied') {
    $('#top').innerHTML = '<div><h1>과학실 교구 검색</h1></div>';
    $('#main').innerHTML = '<div class="panel"><h3>교사 전용 주소예요</h3><p>이 주소는 등록된 선생님만 쓸 수 있어요.' +
      (BOOT.studentUrl ? ' 교구를 찾으려면 <a href="' + esc(BOOT.studentUrl) + '">학생용 검색</a>을 이용해 주세요.' : ' 학생은 학생용 주소를 이용해 주세요.') +
      '</p><p class="note">선생님이라면: 설정 시트에 이메일이 등록되어 있는지, 이 구글 시트가 내 계정에 편집자로 공유되어 있는지 확인해 주세요.</p></div>';
    return;
  }
  if (BOOT.data) { st.data = BOOT.data; st.ver = BOOT.data.ver; render(); startSync(); return; }
  if (HOSTED) {
    if (!/^https:\/\/script\.google\.com\//.test(window.GAS_API)) {
      $('#top').innerHTML = '<div><h1>과학실 교구 검색</h1></div>';
      $('#main').innerHTML = '<div class="panel"><h3>연결 주소가 필요해요</h3><p>GitHub 저장소의 <b>config.js</b> 파일에 학생용 웹 앱 주소(https://script.google.com/…/exec)를 넣어 주세요.</p></div>';
      return;
    }
    const cached = loadCache();   // 지난번 데이터로 먼저 띄우고, 새 데이터로 바로 바꿈
    if (cached) { st.data = cached; st.ver = cached.ver; render(); }
  }
  call(dataFn()).then(d => { const first = !st.data; st.data = d; st.ver = d.ver; saveCache(d); first ? render() : rerender(); startSync(); }).catch(err => {
    if (st.data) { toast('최신 내용을 불러오지 못했어요. 잠시 후 다시 시도해요.', true); startSync(); return; }
    $('#main').innerHTML = '<div class="panel"><h3>불러오지 못했어요</h3><p>' + esc(err.message) + '</p>' +
      (HOSTED ? '<p class="note">학생용 배포의 액세스가 "모든 사용자"인지, GAS_API 주소가 학생용 주소인지 확인해 주세요.</p>' : '') + '</div>';
  });
}

function render() {
  const d = st.data, T = st.mode === 'teacher';
  $('#top').innerHTML = '<div><h1>과학실 교구 검색</h1><div class="sub">' + esc([d.school, T ? '교사용' : ''].filter(Boolean).join(' · ')) + '</div></div>' +
    (T ? '<div class="who">' + esc(d.me) + '<br><a href="' + esc(d.sheetUrl) + '" target="_blank">구글 시트 열기</a></div>'
       : (HOSTED && window.TEACHER_URL ? '<div class="who"><a href="' + esc(window.TEACHER_URL) + '">선생님용</a></div>' : ''));
  const tabs = T ? [['items','교구'],['rg','시약'],['log','출납 기록'],['waste','폐수·폐시약'],['check','점검']] : [];
  $('#tabs').innerHTML = tabs.map(([k, l]) => '<button class="tab' + (st.tab === k ? ' on' : '') + '" data-tab="' + k + '">' + l + '</button>').join('');
  $('#tabs').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { st.tab = b.dataset.tab; render(); });
  const v = { items: viewItems, rg: viewRg, log: viewLog, waste: viewWaste, check: viewCheck }[T ? st.tab : 'items'];
  v();
}

// ───────────────────────── 평면도 ─────────────────────────
const U = 44, PAD = 0.5;
function shortCab(n) {
  return String(n || '').replace('운동과 에너지', '운동').replace('생명과학', '생명').replace('지구과학', '지구')
    .replace(' 사물함', '').replace(/\s+/g, '');
}
function planSVG(spaceId, hiCab, clickable) {
  const d = st.data, cabs = d.cabs.filter(c => c.space === spaceId && c.box);
  if (!cabs.length) return '';
  const maxX = Math.max(...cabs.map(c => c.box[0] + c.box[2])), maxY = Math.max(...cabs.map(c => c.box[1] + c.box[3]));
  const W = (maxX + PAD * 2) * U, H = (maxY + PAD * 2) * U;
  const count = {}; d.items.forEach(it => { count[it.cab] = (count[it.cab] || 0) + 1; });
  const roomName = (d.spaces.find(s => s.id === spaceId) || {}).name || '';
  let g = '<rect x="4" y="4" width="' + (W - 8) + '" height="' + (H - 8) + '" rx="10" fill="none" stroke="#9aa5a0" stroke-width="2"/>' +
    '<text x="' + (W / 2) + '" y="' + (H / 2) + '" text-anchor="middle" dominant-baseline="central" font-size="30" font-weight="700" fill="#e3e8e5">' + esc(roomName) + '</text>';
  cabs.forEach(c => {
    const [x, y, w, h] = c.box, X = (x + PAD) * U, Y = (y + PAD) * U, ww = w * U - 4, hh = h * U - 4, hi = c.id === hiCab;
    const label = ww > 100 ? c.name : shortCab(c.name);
    const m = ww < 70 && /^(\D+)(\d+)$/.exec(label);   // 좁은 사물함은 "지구 / 1"처럼 두 줄로
    g += '<g class="' + (clickable ? 'plan-cab' : '') + '" data-pcab="' + esc(c.id) + '">' +

function cabSVG(cabId, hiKan) {
  const d = st.data, cab = d.cabs.find(c => c.id === cabId) || {};
  const kans = (d.kans || []).filter(k => k.cab === cabId).map(k => Object.assign({ code: k.id.slice(cabId.length + 1) }, k));
  if (!kans.length) return '';
  let grid = [];   // rows of cells
  const LR = kans.every(k => /^[UD][LR]\d+$/.test(k.code)), UD = kans.every(k => /^[UD]\d+$/.test(k.code));
  if (LR) {
    const rows = {}; kans.forEach(k => { const key = k.code[0] + k.code.slice(2); (rows[key] = rows[key] || {})[k.code[1]] = k; });
    Object.keys(rows).sort((a, b) => (a[0] === b[0] ? Number(a.slice(1)) - Number(b.slice(1)) : (a[0] === 'U' ? -1 : 1))).forEach(key => grid.push([rows[key].L, rows[key].R]));
  } else if (UD) {
    kans.slice().sort((a, b) => (a.code[0] === b.code[0] ? Number(a.code.slice(1)) - Number(b.code.slice(1)) : (a.code[0] === 'U' ? -1 : 1))).forEach(k => grid.push([k]));
  } else {
    const nums = kans.slice().sort((a, b) => (Number(a.code) || 0) - (Number(b.code) || 0));
    if (nums.length > 6) { const half = Math.ceil(nums.length / 2); grid.push(nums.slice(half)); grid.push(nums.slice(0, half)); }
    else nums.forEach(k => grid.push([k]));
  }
  const cols = Math.max(...grid.map(r => r.length)), cw = cols === 1 ? 150 : cols === 2 ? 132 : 74, ch = 34, top = 30;
  const W = cols * cw + 16, H = top + grid.length * ch + 12;
  let g = '<text x="' + (W / 2) + '" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2321">' + esc(cab.name || '') + '</text>' +
    '<rect x="6" y="' + (top - 4) + '" width="' + (W - 12) + '" height="' + (grid.length * ch + 8) + '" rx="6" fill="#f1f3f1" stroke="#9aa5a0" stroke-width="1.5"/>';
  let prevU = null;
  grid.forEach((row, ri) => {
    const y = top + ri * ch;
    const isU = row[0] && /^U/.test(row[0].code);
    if (prevU === true && isU === false) g += '<line x1="6" x2="' + (W - 6) + '" y1="' + (y - 0) + '" y2="' + y + '" stroke="#6b7671" stroke-width="2.5"/>';
    prevU = isU;
    row.forEach((k, ci) => {
      if (!k) return;
      const x = 8 + ci * cw, hi = k.id === hiKan;
      g += '<rect' + (hi ? ' class="hi"' : '') + ' x="' + (x + 2) + '" y="' + (y + 2) + '" width="' + (cw - 4) + '" height="' + (ch - 4) + '" rx="4" fill="' + (hi ? '#0f6e5a' : '#ffffff') + '" stroke="' + (hi ? '#0b4f41' : '#c9d1cd') + '" stroke-width="' + (hi ? 2.5 : 1) + '"/>' +
        '<text x="' + (x + cw / 2) + '" y="' + (y + ch / 2) + '" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="' + (hi ? 700 : 400) + '" fill="' + (hi ? '#ffffff' : '#3e4643') + '">' + esc(hi ? '▶ ' + k.name : k.name) + '</text>';
    });
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" role="img" aria-label="' + esc(cab.name || '') + ' 칸 그림">' + g + '</svg>';
}
function whereBlock(kanId, cabId, spaceId) {

    const carry = prev ? Number(prev.remain) || 0 : 0;
    const rec = Object.assign({}, obj, { gen: obj.gen === '' ? '' : Number(obj.gen), done: obj.done === '' ? '' : Number(obj.done), carry: carry, _pending: true });
    rec.remain = carry + (Number(rec.gen) || 0) - (Number(rec.done) || 0);
    d.waste.push(rec); rerender();
    save('addWaste', obj, res => {
      const i = d.waste.indexOf(rec); if (i >= 0) d.waste[i] = res.waste; else d.waste.push(res.waste);
      rerender(); toast('기록했어요');
    }, e => {
      const i = d.waste.indexOf(rec); if (i >= 0) d.waste.splice(i, 1);
      rerender(); toast('기록하지 못했어요: ' + e.message, true);
    });
  };
}

// ───────────────────────── 점검 ─────────────────────────
function viewCheck() {
  const d = st.data, R = d.reagents, yes = v => v === true || v === 'TRUE';
  const groups = [
    ['유효기한 지남', R.filter(r => r.expState === '기한 지남'), 'bad', '유효기한'],

    ['유해화학물질(O)', R.filter(r => r.haz === 'O'), 'bad', '유해화학물질'],
    ['유해 여부 확인 필요', R.filter(r => r.haz === '확인 필요'), 'warn', '확인 필요'],
    ['MSDS 미게시', R.filter(r => !yes(r.msds)), 'warn', 'MSDS 미게시'],
    ['보관 위치 옮기기 권장', R.filter(r => r.check === '옮기기 권장'), 'bad', '옮기기 권장'],
    ['추천 칸 미설정', R.filter(r => r.check === '추천 칸 미설정'), '', null],
    ['폐기예정 시약', R.filter(r => yes(r.waste)), '', '폐기예정'],
    ['확인이 필요한 교구', d.items.filter(i => /확인/.test(i.note || '')), 'warn', null]

  const haz = R.some(r => r.haz === 'O');
  $('#main').innerHTML = '<div class="alert ' + (haz ? 'bad' : 'ac') + '">유해화학물질 보유 여부: <b>' + (haz ? '○ (보유)' : '× (미보유)') + '</b>' +
    (haz ? ' — 별도 보관·이중 잠금·취급주의 표시, 취급시설 자체점검 주 1회(조례 제6조②), 서식2 보고 시 "○"로 표시' : '') + '</div>' +
    '<div class="stats">' + groups.map((g, i) => '<button class="stat" data-g="' + i + '"><div class="v" style="color:' + (g[1].length && g[2] === 'bad' ? 'var(--bad)' : g[1].length && g[2] === 'warn' ? 'var(--warn)' : 'inherit') + '">' + g[1].length + '</div><div class="l">' + g[0] + '</div></button>').join('') + '</div>' +
    '<div id="glist"></div>' +
    '<div class="panel"><h3>정기 점검 일정 (2026 과학실 안전관리 계획)</h3><ul class="note" style="margin:0;padding-left:18px">' +
      '<li>매월 4일: 과학실험실 안전관리 자체 점검표(서식1), 폐수·폐기물 자체 점검표(서식5)</li>' +
      '<li>출납대장(서식3) 5년, 폐수·폐시약 관리대장(서식4) 3년 보존</li>' +
      '<li>상·하반기 안전점검 운영 실적(서식2) 교육지원청 제출</li>' +
      (haz ? '<li>유해화학물질 취급시설 자체점검 주 1회 이상</li>' : '') +
    '</ul><p class="note"><a href="' + esc(d.sheetUrl) + '" target="_blank">구글 시트 열기</a> — 출납대장_출력, 폐수대장_출력, 시약장_목록표 시트에서 인쇄할 수 있어요.</p></div>';
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    const g = groups[Number(b.dataset.g)];
    $('#glist').innerHTML = '<div class="panel"><h3>' + g[0] + ' (' + g[1].length + ')</h3>' + (g[1].length ? '<div class="list">' + g[1].map(x => x.formula !== undefined
      ? '<button class="card" data-rg="' + esc(x.id) + '"><div class="t"><span class="n">' + esc(x.name) + '</span><span class="q">' + esc(x.exp || '') + '</span></div><div class="p">' + esc(x.loc) + '</div></button>'
      : '<button class="card" data-item="' + esc(x.id) + '"><div class="t"><span class="n">' + esc(x.name) + '</span></div><div class="p">' + esc(x.note) + '</div></button>').join('') + '</div>' : '<p class="note">해당 없음</p>') + '</div>';
    $('#glist').querySelectorAll('[data-rg]').forEach(c => c.onclick = () => rgDetail(c.dataset.rg));
    bindItemCards($('#glist'));
    $('#glist').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

start();
})();
